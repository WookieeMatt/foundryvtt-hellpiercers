name: Morax
type: boss
img: systems/hellpiercers/assets/icons/warlord-helmet.svg
system:
  biography: >-
    <p><em>OF THE BROKEN HORN</em></p><p>Once a great king of their own domain, commanding a
    thousand Hell Legions, their horn was broken in the first war, and their magic greatly reduced.
    Still, the flames of their long lost home still burns in the craven hole where their heart would
    be.</p><p>Crown cost: 4 · Actions: 1/2 per player</p>
  faction: EKKLESIA
  tags:
    - Boss
  health:
    value: 250
    max: 250
    temp: 0
  scale: 1
  speed: 6
  actions: 1/2
  agnosia:
    value: 100
    effect: >-
      <p>Select a type of Minion and remove them from the battle. Detonate all Primed spaces. Allied
      units and other demons within <strong>Burst:2</strong> recover HP equal to the number of
      removed minions, while HELLPIERCER units within <strong>Burst:2</strong> take damage equal to
      the number of removed minion units. Morax gains the following:</p><p>All tiles
      <strong>Primed</strong> by Morax gain <strong>Countdown:3</strong>. When Countdown reaches
      zero, the Primed tile detonates, dealing 5 damage to any units standing on the tile, and 2
      damage to any adjacent units.</p>
    triggered: false
