system:
  biography: >-
    <p><em>THE RELUCTANT SLUMBERER</em></p><p>Also known as the Great Somnambulist. Her demonic
    court endeavors to keep her amused and awake at all times, but her exhaustion is entropic. The
    closer to sleep she gets, the harder she rages. Once she falls asleep, none can stop her
    movements.</p><p>HP is shared by the whole Swarm (HP Total) · Speed: 9(Slumber) 4(Thrashing) ·
    Crown cost: 4 · Actions: 1/2 per player</p>
  faction: THELETUS
  tags:
    - Boss
  health:
    value: 230
    max: 230
    temp: 0
  scale: 1
  speed: 9
  actions: 1/2
  agnosia:
    value: 115
    effect: >-
      <p>AMDUSIAS begins to rouse through bleary eyes. She bellows ferociously inflicting
      <strong>Pin:1</strong> on all units who can hear in</p><p>range:3 as she grows to
      <strong>Scale:2</strong>. She adopts a bestial visage with hoarfrost claws and crystaline
      fangs. End Slumber Phase and Enter Thrashing Phase as AMDUSIAS fights against the return of
      The Slumber.</p>
    triggered: false
