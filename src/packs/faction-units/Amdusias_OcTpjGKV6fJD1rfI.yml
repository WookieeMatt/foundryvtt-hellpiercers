  - _id: w4qSs5G3HagefcoP
    name: Special
    type: ability
    img: systems/hellpiercers/assets/icons/round-star.svg
    system:
      action: special
      effect: >-
        <h4>Thrashing Phase</h4><p><strong>Line:5 Width:3</strong>. <strong>Damage:5</strong>.
        <strong>Shatter:</strong> 7 damage. Create uneasy terrain in <strong>Burst:1</strong> of all
        shattered units, then they suffer <strong>Push:1</strong>.</p><p><strong>Range:1,
        Damage:4</strong>. Shatter: 8 Damage. Unit gains <strong>Compel:2</strong>.</p><p>Burst:3.
        <strong>Damage:3</strong>. Shatter: 5 damage. Inflict <strong>Bleed:2</strong>. If this
        attack <strong>Shattered</strong> any units, this attack gains <strong>Lingering</strong>
        for damage spaces within <strong>Burst:2</strong>.</p><p>Whenever a unit on the battlefield
        is Frozen, gain one Charge. Charge may be spent as follows:</p><p><strong>3 Charge:
        </strong>Next attack gains Transference.</p><p><strong>2 Charge (only after
        AGNOSIA):</strong> Revert to Slumbering Phase. AGNOSIA value is now half this unit’s current
        HP.</p><p><strong>1 Charge:</strong> Pick a unit. The next attack on this unit that triggers
        Shatter does not remove any stacks of Frozen.</p><p><strong>8 Charge:</strong> The next
        attack against all units that trigger Shatter does not remove any stacks of
        Frozen.</p><p><strong>12 Charge:</strong> Detonate all stacks of Frozen on all units. They
        take damage equal to twice their Frozen value. Reapply <strong>Frozen:1</strong> to all
        units. This reapplication does not provide any Charges.</p><p>AMDUSIAS begins combat in
        Slumbering Phase. While in Slumbering Phase, AMDUSIAS cannot be affected by nonstandard
        terrain types or Slowed.</p><h4>Slumbering Phase</h4><p>Place three dreamform nodes within
        range 5. All creatures within <strong>Burst:1</strong> of these nodes are
        <strong>Frozen:3</strong>. Any units who enter <strong>Burst:1</strong> of the nodes are
        likewise frozen. AMDUSIAS may move to any of these nodes once per turn without spending any
        movement. Other units may not occupy the same space of the nodes. AMDUSIAS may have a
        maximum of 4 nodes total. Placing nodes beyond the 4th will require erasing a prior
        node.</p>
