name: Caim
type: boss
img: systems/hellpiercers/assets/icons/warlord-helmet.svg
system:
  biography: >-
    <p><em>THE FIRST BLOODIED</em></p><p>When the Archons found themselves distracted with the
    arrival of Syzygos, CAIM found the opportunity to take vengeance for their slights against him.
    Baptised in their blood, CAIM dedicated himself to the pursuit of a furious justice and
    order.</p><p>Crown cost: 4 · Actions: 1/2 per player</p>
  faction: METRICOS
  tags:
    - Boss
  health:
    value: 200
    max: 200
    temp: 0
  scale: 1
  speed: 6
  actions: 1/2
  agnosia:
    value: 50
    effect: >-
      <p>When CAIM hits AGNOSIA, immediately teleport to a free space adjacent to the nearest Swarm.
      Reshape the Swarm into any shape, as long as the shape adheres to existing movement and
      placement rules. The Swarm may overlay or collide with player characters already in play.
      After placing the new Swarm, if any Swarm tiles collide with or overlay an existing player
      character, Break, and deal 5 damage to the player character. Reshaping the Swarm ignores
      movement penalties and elevation.</p>
    triggered: false
