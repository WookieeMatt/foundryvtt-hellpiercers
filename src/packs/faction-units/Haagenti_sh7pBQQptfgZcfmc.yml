name: Haagenti
type: boss
img: systems/hellpiercers/assets/icons/warlord-helmet.svg
system:
  biography: >-
    <p><em>THE NEVER-SATED</em></p><p>A gaunt creature in the shape of a humanoid woman, her
    elongated hands and amorphous feet perpetually bleed a bitumen-like substance called ANATHEMA
    that drains the life out of everything it touches.</p><p>Crown cost: 4 · Actions: 1/2 per
    player</p>
  faction: AUTOPHYES
  tags:
    - Boss
  health:
    value: 200
    max: 200
    temp: 0
  scale: 2
  speed: 8
  actions: 1/2
  agnosia:
    value: 50
    effect: >-
      <p><strong>Burst:3</strong> for 5 damage, create a 3x3 Box around <strong>Haagenti</strong> of
      <strong>ANATHEMA</strong>. In addition, any instance of damage dealt
      by</p><p><strong>ANATHEMA</strong> on the map while she is in <strong>AGNOSIA</strong> creates
      a special <strong>Sloucher</strong> minion with <strong>HP</strong> equal to the amount of
      damage dealt. It is placed directly adjacent to the victim by the GM and its sole desire in
      the world is to be consumed again by <strong>Haagenti</strong>, restoring her whatever HP it
      has when it makes it to a space adjacent to her.</p>
    triggered: false
