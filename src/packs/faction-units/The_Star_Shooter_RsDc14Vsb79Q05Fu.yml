    description: >-
      <p><strong>Range:6, Burst:1, Damage:3</strong>. If a target in <strong>Burst</strong> is at
      equal or lower elevation to the Star Shooter, they may cause up to one target who meets that
      criteria to increase the level of their elevation by one.</p>
  special:
    name: Special
    description: >-
      <p><strong>Range:1, Damage:2, Push:4</strong>. If the target collides with any other units,
      damage is dealt per the <strong>Push</strong> rules, but to the unit collided with instead of
      the target unit.</p><p><strong>Range:6</strong>, <strong>Damage:2</strong>. If this attack
      targets a unit at elevation higher than the Star Shooter’s current elevation, that unit
      immediately descends until they collide with the ground. Deal damage to the target equal to 2
      + the units of elevation moved during the descent.</p><p>The Star Shooter deals an additional
      point of damage on attacks which target a unit at a higher level of elevation than them.</p>
  agnosia:
    value: 30
    effect: >-
      <p>The Star Shooter may target up to two units within <strong>Burst:4</strong> and immediately
      force them to increase their level of elevation by two. This unit may then make an attack
      without consuming their action for the turn.</p>
