name: The Star Shooter
type: minion
img: systems/hellpiercers/assets/icons/cultist.svg
system:
  biography: >-
    <p>A mushroom sits atop their head, forming a brim which cuts across their face, framing their
    menacing visage. Beneath a tattered and flowing overcoat it holsters two dueling
    pistols.</p><p>Codename: Exacontismos</p>
  faction: HENOSIS
  tags:
    - Miniboss
  health:
    value: 80
    max: 80
    temp: 0
  scale: 1
  speed: 5
  strike:
    name: Strike
    range:
      kind: burst
      value: 1
    damage:
      formula: '3'
    description: >-
      <p><strong>Range:6, Burst:1, Damage:3</strong>. If a target in <strong>Burst</strong> is at
      equal or lower elevation to the Star Shooter, they may cause up to one target who meets that
      criteria to increase the level of their elevation by one.</p>
  special:
    name: Special
    description: >-
      <p>The Star Shooter deals an additional point of damage on attacks which target a unit at a
      higher level of elevation than them.</p>
  agnosia:
    value: 30
    effect: >-
      <p>The Star Shooter may target up to two units within <strong>Burst:4</strong> and immediately
      force them to increase their level of elevation by two. This unit may then make an attack
      without consuming their action for the turn.</p>
    triggered: false
