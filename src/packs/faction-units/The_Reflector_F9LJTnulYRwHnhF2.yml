    description: <p><strong>Range:2, Burst:1, Damage:3</strong></p>
  special:
    name: Special
    description: >-
      <p>When attacked by a unit within <strong>Range:2</strong> of this unit, it may force the
      attacking unit to gain one elevation. If the elevated unit has no means to maintain their
      elevation, they will begin falling at the start of their next turn.</p>
  agnosia:
    value: 40
    effect: >-
      <p>Gain <strong>Charge:3</strong>. When taking damage for another unit you may spend one
      <strong>Charge</strong> to nullify all damage on that attack. You may spend <strong>2 Charges
      </strong>to nullify all damage and force the attacking unit to gain 2 elevation. If the
      elevated unit has no means to maintain their elevation, they will begin falling at the start
      of their next turn.</p>
    triggered: false
