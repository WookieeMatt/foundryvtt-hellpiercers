system:
  biography: >-
    <p>A hulking demon that utilizes two calcified mushrooms as twin aegises. Scars run across their
    body, a marker of battlefield prowess and disasters averted for their allies.</p><p>Codename:
    Palintropos · Crown cost: 3</p>
