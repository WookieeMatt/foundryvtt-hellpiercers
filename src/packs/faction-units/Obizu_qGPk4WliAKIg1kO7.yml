name: Obizu
type: boss
img: systems/hellpiercers/assets/icons/warlord-helmet.svg
system:
  biography: >-
    <p><em>THE LEVIATHAN REBORN</em></p><p>The Polyp tried in vain to share the gilded truth with
    its neighbors, but ignorance turns lavender to spears and humanity had learned long to fear
    those rising from the sea. Their Queen’s blood would awaken a dawnless age, and her rebirth
    foretold their infernal kingdoms.</p><p>Sprawl: 8 · Crown cost: 4</p>
  faction: MIXIS
  tags:
    - Boss
  health:
    value: 250
    max: 250
    temp: 0
  scale: 1
  speed: 4
  actions: '1'
  agnosia:
    value: 150
    effect: >-
      <p>Instantly convert all remaining <strong>Snake</strong> into Speed, reduce
      <strong>Speed</strong> by 1 each following round until OBIZU’s Speed reaches 5. OBIZU gains
      the following abilities:</p><p>OBIZU now gains health whenever a Consumed unit takes damage,
      equal to the damage taken.</p><p>OBIZU may now spend <strong>Snake</strong> before attacking
      to increase the damage of any attack by the amount of Snake spent.</p><p>OBIZU may now
      <strong>Consume</strong> adjacent allied units to gain 1 Snake. Consumed minions are instantly
      destroyed and leave the battlefield, minibosses follow all the same rules as player units,
      taking damage at the start of their turn until they leave the snake.</p>
    triggered: false
