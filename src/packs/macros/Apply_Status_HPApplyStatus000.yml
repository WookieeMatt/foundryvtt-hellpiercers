name: Apply Status
type: script
command: |-
  const statuses = Object.values(CONFIG.statusEffects).filter(s => s.hud !== false && !s.flags?.core?.overlay);
  const options = statuses.map(s => `<option value="${s.id}">${game.i18n.localize(s.name)}</option>`).join("");
  const input = await foundry.applications.api.Dialog.input({
    window: { title: "Apply Status", icon: "fa-solid fa-plus" },
    content: `<div class="form-group"><label>Status</label><div class="form-fields"><select name="status">${options}</select></div></div><div class="form-group"><label>Stacks</label><div class="form-fields"><input type="number" name="stacks" value="1" min="1"></div></div>`,
  });
  if (!input) return;
  const targets = canvas.tokens.controlled.length ? canvas.tokens.controlled : [...game.user.targets];
  if (!targets.length) return ui.notifications.warn("Select a token first.");
  await hellpiercers.status.add(targets, input.status, Number(input.stacks));
