name: Clear Status
type: script
command: |-
  const statuses = Object.values(CONFIG.statusEffects).filter(s => s.hud !== false);
  const options = statuses.map(s => `<option value="${s.id}">${game.i18n.localize(s.name)}</option>`).join("");
  const input = await foundry.applications.api.Dialog.input({
    window: { title: "Clear Status", icon: "fa-solid fa-eraser" },
    content: `<div class="form-group"><label>Status</label><div class="form-fields"><select name="status">${options}</select></div></div>`,
  });
  if (!input) return;
  await hellpiercers.status.remove(null, input.status);
img: icons/svg/cancel.svg
