name: Damage Targets
type: script
command: |-
  const input = await foundry.applications.api.Dialog.input({
    window: { title: "Damage Targets", icon: "fa-solid fa-burst" },
    content: `<div class="form-group"><label>Amount</label><div class="form-fields"><input type="number" name="amount" value="5" min="0" autofocus></div></div><div class="form-group"><label>Raw</label><div class="form-fields"><input type="checkbox" name="raw"></div><p class="hint">Skip Armor, Bleed and other modifiers.</p></div>`,
  });
  if (!input) return;
  const targets = game.user.targets.size ? [...game.user.targets] : canvas.tokens.controlled;
  if (!targets.length) return ui.notifications.warn("Target or select a token first.");
  await hellpiercers.damage(targets, Number(input.amount), { raw: input.raw });
