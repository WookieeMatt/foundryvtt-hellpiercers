name: Grant Temporary HP
type: script
command: |-
  const input = await foundry.applications.api.Dialog.input({
    window: { title: "Temporary HP", icon: "fa-solid fa-shield-heart" },
    content: `<div class="form-group"><label>Amount</label><div class="form-fields"><input type="number" name="amount" value="2" min="1" autofocus></div></div>`,
  });
  if (input) await hellpiercers.tempHP(null, Number(input.amount));
