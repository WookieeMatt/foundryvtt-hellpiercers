system:
  description: >-
    <p><em>These warheads exist in an indeterminate state until their waveform
    is collapsed into one of several configurations prior to firing, from
    conventional high-explosive to cratering and seismic charges, as well as
    “pitfall” atomics capable of destabilizing local hellspace upon
    detonation.</em></p>
  counter:
    enabled: false
    value: 0
    max: null
  effect: >-
    <p>Launch a cluster of time-delayed rockets. Mark three unoccupied spaces
    within Range:3 of the center space of the Blast which last until the end of
    your next turn. These spaces can't be adjacent to each other and are visible
    to everyone. Hostile characters who move into or through these spaces are
    hit by a rocket and take 5 damage. This Effect also triggers when this
    weapon’s Secondary Mode is used.</p>
  secondary:
    action: main
    effect: >-
      Blast:2 within Range:5, launch a specialized warhead that deals no damage
      with one of the following effects:</p><p>Cratering Charge - All spaces of
      Cover or Uneasy terrain become normal terrain.</p><p>Seismic Charge - Any
      spaces of normal terrain of your choice within this area become either
      Cover or Uneasy terrain (you may decide which type on a per space
      basis).</p><p>Pitfall Charge - Roll 1D6. Up to that many unoccupied spaces
      of your choice within this area become Void terrain.
