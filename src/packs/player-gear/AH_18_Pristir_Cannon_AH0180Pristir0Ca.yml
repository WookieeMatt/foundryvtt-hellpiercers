    max: null
  effect: >-
    <p>Create a Blast:2 area of suppressive fire centered on your target that
    lasts until the start of your next turn. Hostile characters are treated as
    having Shock while within this area; if they move outside of this area, the
    effect immediately ends and they take 10 damage.</p>
  secondary:
    action: main
    effect: >-
      At the start of your turn, you may switch your HALO Unit's fire control
      systems over to an automatic sentry mode. While in this mode, you become
      Slow and cannot use this weapon to attack, but whenever an attack
      originating from further than Range:3 targets you or an adjacent allied
      character, roll 1D6; on 5+, that attack is shot down by ward-engraved
      bullets and harmlessly neutralized. Any hostile character that moves
      within Range:3 of you or closer while sentry mode is active automatically
      takes 5 damage. You may deactivate sentry mode at the start of your turn.
