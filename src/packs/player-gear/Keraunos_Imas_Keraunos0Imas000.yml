  counter:
    enabled: true
    value: 0
    max: null
  effect: >-
    <p>Inflict Wrack equal to the flat damage value dealt by this attack (e.g. a
    damage roll of 5+3D8+6 will inflict Wrack:11). </p><p><em>This attack deals
    +3 Damage to all targets for each non-Swarm target within its area (e.g. if
    three non-Swarm targets are attacked, all targets take +9 damage).</em></p>
  secondary:
    action: passive
    effect: >-
      Unlike other HALO Unit weapons, Keraunos Imas's Secondary Mode activates
      automatically once the weapon has been fired. At the start of your next
      turn after attacking with it, your mech begins drawing in ambient energy
      to recharge its capacitors and becomes wreathed in crackling divine
      electricity from the overflow. This generates a Burst:2 area around you;
      hostile characters that begin their turn in this area or enter it for the
      first time in a round generate an Arc:2, Slow:2 effect on nearby enemy
      units. Allied characters that begin their turn in this area or adjacent to
      you are empowered by coursing energy, causing their next attack to deal
      Wrack:3 in addition to its usual effects (this does not stack with
      itself). At the start of your following turn, this effect ends and
      Keraunos Imas can be fired once again.
