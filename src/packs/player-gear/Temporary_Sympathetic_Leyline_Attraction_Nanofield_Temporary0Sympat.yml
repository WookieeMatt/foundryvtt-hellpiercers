  description: >-
    <p><em>We make allies of the very wounds you cause. Our bleeding, broken
    bodies reknit at our asking; your fire and bile sloughs at our request. I
    have made a comrade of the matter under your feet and sing harmonies with
    the weapon in my hands.</em></p>
  kind: weapon
