    <p>Once per round, when you take damage, you may take any amount of it as
    Temporary Damage instead. On your next turn, each time you harm enemies,
    heal 1 point of Temporary Damage per enemy harmed. Convert all remaining
    Temporary Damage to regular damage at the end of that turn.</p>
