  active:
    name: Roaming Strikes
    description: >-
      <p>You take a powerful riposte stance. Until your next move or attack, you
      gain <strong>Armor:2</strong> and <strong>Compel:1</strong> and you may
      not use any <strong>Reversal</strong> abilities. Enemy attacks against you
      grant 1 stack of <strong>Retaliation</strong> while you are in this
      stance. When you end your turn with stacks of
      <strong>Retaliation</strong>, but aren’t in this stance, you lose 1 stack
      of it. On any of your turns following this one when you have at least
      <strong>Retaliation:1</strong>, you may make an attack with
      <strong>Charge</strong>, <strong>Arc:X</strong>, where <strong>X</strong>
      is your starting <strong>Speed</strong> plus your stacks of
      <strong>Retaliation</strong>. When making this attack, you may spend
      <strong>Retaliation</strong> to modify the attack. You may gain 1 modifier
      per 1 stack of <strong>Retaliation</strong> spent, with no restrictions on
      duplicate effects: </p><ul><li>You gain Aegis:1 before your attack
      </li><li>Your attack gains the Breaker tag </li><li>Your attack gains
      Bleed:1 </li><li>Your attack gains Lingering:1 </li><li>Your attack gains
      Push:2 </li><li>Your attack gains +1 Damage </li><li>You may make one
      square in your pattern Uneasy after your attack </li></ul><p></p>
  passive:
    name: Eight-Folded Four-Fold Tetragram
    description: >-
      <p>When you kill an enemy with this weapon, you may move into the empty
      space and perform a regular attack as a free action.</p>
