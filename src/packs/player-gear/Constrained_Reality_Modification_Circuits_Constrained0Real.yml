_id: Constrained0Real
name: Constrained Reality Modification Circuits
img: icons/commodities/tech/tube-chamber-lightning.webp
type: equipment
system:
  description: >-
    <p><em>Hell is a patchwork of a million forgotten worlds. These circuits
    reverse the thaumic flow of nearby shards to disrupt Hell's hold over them,
    and remind them of a time when they were something more.</em></p>
  effect: >-
    <p>Centered on yourself, draw a 3x3 box on the current map. Together with
    your party, come up with a new rule or a tweak for an existing rule. This
    can be anything: make movement free, allow players to swap positions as an
    action, give special properties to existing terrain effects, etc. As long as
    you remain in this box, your rule remains active. If you are pushed out of
    the box, it vanishes. Rules may not directly adjust the stats of any
    creature, and must be agreed upon by everyone at the table as consistent
    with the other rules of the game.</p>
