system:
  description: >-
    <p><em>"While the raiment effect that results from soul synchronization with
    a HALO Unit is known for the wide variety of dramatic physical
    transmutations that occur within a piloted mech, with additional training
    and the integration of specially attuned focusing arrays, this effect can be
    further enhanced for offensive purposes as well. A developmental outgrowth
    of research into Temporal/ Spiritual Interpolation, a so-called divine
    weapon manifestation array is less of a singular armament and more an
    expression of the pilot’s will made manifest."</em></p>
  counter:
    enabled: false
    value: 0
    max: null
  effect: >-
    <p>You may attack up to three different targets within Range:3 each time you
    use this weapon and spread your damage across selected targets as evenly as
    possible. If you choose to attack only a single target, roll your damage
    twice and take the best result.</p>
  secondary:
    action: support
    effect: >-
      Choose an allied character within Range:3 and imbue them with a manifested
      weapon of spiritual energy, its form reflecting the user's own soul; a
      character can only be imbued with one of these weapons at a time. During
      their turn, a character with a manifested weapon can perform the following
      attack as a Support Action:</p><h4>HALO Imbued Reality</h4><p>Rending
      Rounds<br>2D10 Damage<br>Attack Pattern: Range:3</p><p>Effect - Before
      making this attack, you may teleport to any free space adjacent to the
      target. Against targets with Bleed, this attack also gains Transference.
