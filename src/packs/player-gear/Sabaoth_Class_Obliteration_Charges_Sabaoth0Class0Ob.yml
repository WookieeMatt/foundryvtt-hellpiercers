  active:
    name: Apocalypse Sundering Omnistrike
    description: >-
      <p>Spend a <strong>Charge</strong> (see below). Make an attack combining
      the attack patterns of any two bomb types, which may fit together in any
      shape as long as they have at least one pair of squares adjacent to, or
      overlapping, each other. Apply the <strong>Effects</strong> and
      <strong>damage</strong> from each bomb in all squares of the combined
      pattern.</p>
  passive:
    name: Dynamic Gnosis
    description: >-
      <p>You begin each TACCOM Combat with <strong>5 Charges</strong>. You can
      spend a <strong>Charge</strong> at any time to set your current bomb type,
      selecting an option below and using its <strong>Damage</strong>,
      <strong>Pattern</strong>, and <strong>Effects</strong> for your weapon
      attacks until the end of the combat or you replace your selected bomb type
      by spending another <strong>Charge</strong>. Any time an ability or effect
      would restore your <strong>Equipment</strong>, you also return to
      <strong>5 Charges</strong>. You cannot make weapon attacks with no bomb
      type selected.</p>
