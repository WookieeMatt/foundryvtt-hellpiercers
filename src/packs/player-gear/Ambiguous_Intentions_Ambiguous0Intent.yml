  active:
    name: Terminating The Eightfold Path
    description: >-
      <p>When you attack, if one of the squares in your attack pattern is empty,
      you may immediately move into that square for zero movement cost and take
      a free attack with <strong>-1 damage</strong>. You may repeat this as long
      as you deal at least 1 damage to any target, with each subsequent attack
      dealing an additional <strong>-1 damage</strong>. When you move,
      <strong>Mark</strong> the spaces you step into. You may not move into a
      <strong>Marked</strong> tile in this way. Remove all of your
      <strong>Marks</strong> at the start of your next turn.</p>
  passive:
    name: Blood−Hungry Enhancement Prayer
    description: >-
      <p>For each enemy killed with Ambiguous Intentions during your turn, gain
      <strong>1 Charge</strong>. When you attack with 3 or more
      <strong>Charges</strong>, the attack is <strong>Burst:2</strong> and
      ignores the weapon’s damage reduction penalties, then loses <strong>3
      Charges</strong>.</p>
