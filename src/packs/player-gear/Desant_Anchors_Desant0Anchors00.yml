system:
  description: >-
    <p><em>Despite everything, the spinther yearns to connect with more of its
    kind, and even the facsimile of divinity, or corruption thereof, cries out
    for its celestial shadow. Additional quick-mounting anchor points,
    footholds, and deployable cover panels allow HELLPIERCER units to quickly
    hook up and dismount from a mech as needed.</em></p>
  effect: >-
    <p>Whenever you move, up to two allied characters you are overlapping can
    move with you, mirroring your movement exactly.</p>
  upgrades:
