name: Longinus Driver
img: icons/weapons/polearms/spear-flared-silver-pink.webp
type: halo_weapon
_id: Longinus0Driver0
system:
  description: >-
    <p><em>Symbolically, practically, and metaphysically, both the stake and the
    spear have long historical associations with slaying evil and spilling the
    blood of the divine. While several proposals were raised during the planning
    stages for a mech-tier tactical melee weapon, it was these qualities which
    ultimately led engineers towards the development of the Longinus Driver. A
    straightforward weapon, the driver utilizes a captive bolt design to
    electromagnetically accelerate a superhardened, ward-engraved spike with
    devastating force, capable of penetrating even the toughest of hellforged
    armor in a single blow.</em></p>
  counter:
    enabled: false
    value: 0
    max: null
  effect: >-
    <p>Choose an attack profile at the beginning of combat; you may switch
    profiles as a Support Action. This weapon begins each combat charged. Before
    or after you make an attack with this weapon while it is charged, you may
    move 2 spaces. </p><p>Hammer Profile - 30 Damage, Range:3,
    Push:6</p><p>Spike Profile - 2D10 Damage, Line:3, Piercing, Shock:1. Targets
    take +10 damage for each space the Line extends through or overlaps with the
    target beyond the first (a target that is hit by the very end space of the
    line will take 2D10 damage, while a target that is adjacent to the HALO Unit
    will take 20+2D10 damage).</p><p>Once this weapon has been used to attack,
    it becomes discharged. You may continue to attack with it while discharged
    to reduced effect:</p><p>Hammer Profile - 2D10 damage, Range:3,
    Push:2</p><p>Spike Profile - 2D10 damage, Line:3, Piercing</p>
  secondary:
    action: main
    effect: Charge this weapon, and you may move up to 2 spaces.
