name: Ablative Pseudo-Soul
img: icons/magic/defensive/barrier-shield-dome-deflect-blue.webp
type: gear
system:
  description: >-
    <p><em>In the hands of a skilled worker, simple nous-stuff can be
    synthesized from lower-order creatures, such as krill. These pseudo-souls
    lack consciousness, but will often grow a sense of self. Should it attain
    synesis, its protectively incorruptible aspects fail—with awareness comes
    risk.</em></p>
  kind: armor
  effect: >-
    <p>You have a pool of 5 Temporary HP. This Temporary HP restores at the end
    of your turn every round. You may share any amount of this Temporary HP with
    any adjacent target as an Aux Action. Temporary HP takes damage before HP.
    If you have multiple sources of Temporary HP, you choose the order in which
    they take damage.</p>
