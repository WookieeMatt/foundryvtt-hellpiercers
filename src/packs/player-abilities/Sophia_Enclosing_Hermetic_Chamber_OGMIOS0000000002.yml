name: Sophia Enclosing Hermetic Chamber
img: icons/commodities/gems/pearls-white.webp
type: ability
system:
  action: passive
  effect: >-
    <p>You control a small pocket dimension compressed into a jewel, ritual
    token, or other small object. Using the 59th Level Sophia Transposing Art,
    you can transport any active object from the current battlefield into this
    pocket dimension. The pocket dimension is represented by a 5x5 grid that
    shares no squares with the main map. When you enter your own pocket
    dimension, this vessel falls into the square you were in. Allies can carry
    it while you’re within.  </p><hr />During combat, when you kill a miniboss
    or swarm, gain <strong>Perspective:1</strong>. Spend any number of stacks of
    <strong>Perspective</strong> as a <strong>free action</strong> to alter the
    properties of your pocket dimension in the following ways:  <ul><li>The next
    friendly unit to enter the  dimension gains +1 HP per Stack spent. This can
    increase max HP until the end of the current TACCOM.  </li><li>The next
    friendly unit to enter the  dimension gains +1 Damage to their next attack
    per Stack spent.  </li><li>Increase your Hermetic Crystal’s HP by 1 per
    stack spent until the end of TACCOM. You may exceed its starting HP. 
    </li><li>Place 2 wraiths inside your grid. They have the following stats:
    {INSERT LINK HERE] </li></ul>Your grid must always contain your Sophia
    Enclosing Hermetic Crystal. This Fortification has the following stats: 
    [INSERT LINK HERE]<p></p><p>If at any point the crystal is destroyed,
    anything and everything within the pocket dimension is ejected onto free 
    spaces adjacent to the character. If no  adjacent space is free, the table
    can decide where the creatures and objects end up. After the grid is
    completely empty, reset your grid and replace the Sophia  Enclosing Hermetic
    Crystal.</p>
