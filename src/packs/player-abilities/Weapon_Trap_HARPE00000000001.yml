  action: active
  effect: >-
    <p>Throw your weapon up to 6 spaces in any of the four cardinal directions.
    If you have line of sight to your thrown weapon and a moving enemy breaks
    it, interrupt the current action. Deal the maximum damage your weapon can do
    and Pull the enemy any number of spaces you choose toward you or toward your
    thrown weapon. Your weapon recalls to you when the trap activates or when
    you spend a <strong>Support Action</strong> during your turn to retrieve it.
    When you recall your weapon, you may equip any weapon in your possession as
    a free action.</p>
