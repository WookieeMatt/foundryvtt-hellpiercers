_id: MACROPROSOPUS002
name: Litany of Transmogrification
img: icons/magic/perception/shadow-stealth-eyes-purple.webp
type: ability
system:
  action: active
  effect: >-
    <p>Place a copy of yourself within <strong>Range:3</strong>. This copy has 1
    HP. Actions, including attacks and movement, may be made from either your
    original self or the copy. You may have up to 3 copies active at any time.
    Characters in this armor and copies made using its ability have the
    <strong>Swarm</strong> trait, and may convert into a Swarm as a
    <strong>Support Action</strong>. This Swarm does not receive the HP benefits
    of swarming, but does receive <strong>+1 damage</strong> for each square of
    the Swarm adjacent to the target. When you swarm, you are not limited to
    attacking adjacent enemies like demon Swarms. You may split your actions and
    movement between your clones however you wish (e.g. you may spend 3 Speed on
    a clone and 2 Speed on yourself) but all movement must occur at the same
    time.</p>
