  effect: >-
    <p>When you have dealt a cumulative  total of 20 damage or more to  enemies
    using attacks or abilities as a pilot, your HALO Unit’s self-repair systems
    are briefly supercharged, reinstantiating it and making it ready for
    immediate use. Your HALO Unit is either Rezzed at the location it was
    destroyed or it teleports to your current location and is Rezzed (any
    hostile characters overlapping the HALO Unit’s space when this occurs are
    pushed to the nearest unoccupied spaces); in both cases, you automatically
    teleport back into its cockpit and are ready to resume combat
    operations.</p>
