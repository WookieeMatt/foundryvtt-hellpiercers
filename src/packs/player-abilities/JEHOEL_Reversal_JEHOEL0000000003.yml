name: JEHOEL Reversal
img: icons/tools/fasteners/chain-steel-grey.webp
type: ability
system:
  action: reversal
  effect: >-
    <p>Immediately convert the nearest special terrain to Link and send the
    attacker through it. If there are no other Link tiles on the map at this
    time, the enemy vanishes and emerges from the next Link tile you create.
    Whether the enemy emerges immediately or later, you may rotate it to any
    facing you choose, then it completes its attack, inflicting its damage and
    Effects wherever it now aims.</p><p><em>The hunt was one of endurance. Of
    hundreds of thousands of footsteps and with each the question of if the next
    would take you where your senses told you they would. As long as humanity
    has hunted, it has excelled in outpacing and exhausting its prey. Jehoel,
    despite her cunning, was no different. We gutted her like a mammoth on a
    dais made of firmament.</em></p>
  trigger: Targeted by an enemy attack while on or adjacent to special terrain
