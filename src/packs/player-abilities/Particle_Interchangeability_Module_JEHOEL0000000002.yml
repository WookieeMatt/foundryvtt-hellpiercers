  action: active
  effect: >-
    <p>When moving into any kind of special terrain, you may spend a
    <strong>Support Action</strong> to permanently convert it into
    <strong>Link</strong> terrain. <strong>Link</strong> terrain allows movement
    between itself and any other <strong>Link</strong> terrain as if the spaces
    were adjacent. <strong>Link</strong> does not count as one of the two types
    of special terrain a tile can be.</p>
