    benefits below: </p><ul><li>Shelter - The Advantageous terrain becomes
    Advantageous with <strong>Cover</strong></li><li>Succor - The Advantageous
    terrain becomes Advantageous with <strong>Healing:1</strong></li><li>Stymie
    - The Advantageous terrain becomes Advantageous with
    <strong>Uneasy</strong></li><li>Settle - The Advantageous terrain becomes
    Advantageous with <strong>Fortified</strong></li></ul> <strong>Activation is
    contagious</strong>—it affects all contiguous <strong>Advantageous</strong>
    spaces at once. You may only have one benefit active at any one time.
    Changing the active benefit or applying the benefit to a different cluster
    of advantageous terrain removes any previously applied benefits to any
    previously activated spaces. Previously enhanced tiles revert to
    Advantageous terrain with no other modifiers.<p></p>
