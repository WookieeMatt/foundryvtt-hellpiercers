  action: reversal
  effect: >-
    <p>Transform into a tile of Advantageous Terrain, avoiding the initial
    attack. Remain in this state until the end of your next turn. In this form
    you may move as normal, but all other actions are impossible until the end
    of your next turn. Players may trigger you as if you were any other piece of
    Advantage terrain, and you may move under other players and enemies,
    imparting any relevant effects when you do.</p><p><em>Those who strike
    against you strike against the light of the Monad and the breath of the
    world. A wound against one is a wound against all.</em></p>
