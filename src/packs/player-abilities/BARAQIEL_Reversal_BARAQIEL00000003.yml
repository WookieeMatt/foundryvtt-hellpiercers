system:
  action: reversal
  effect: >-
    <p>Launch the attacking enemy to elevation 3, interrupting their attack.
    Unless otherwise brought to the ground or defeated, at the start of the
    enemy’s next turn they fall to the ground, taking the damage of their own
    attack. Then, their impact deals the same damage plus one for each Elevation
    they fell in Burst:2 centered on the unit’s impact site. All units damaged
    by your reversal gain Pin:1. If another unit occupies the space where the
    enemy falls, the occupying unit is pushed to the nearest unoccupied
    space.</p><p><em>Each feather fell suffused in milky-sweet ambrosia from
    Baraqiel's nest atop the grandest tree in Ogdoad's Breast. We sang for our
    homes knee-deep in the dirt-streaked nectar by the featherless body strewn
    across the massive stump.</em></p>
