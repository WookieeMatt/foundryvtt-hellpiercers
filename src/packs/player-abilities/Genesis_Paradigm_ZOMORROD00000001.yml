  effect: >-
    <p>You begin each battle with <strong>3 Charges</strong>. As a
    <strong>Support Action</strong>, spend a <strong>Charge</strong> to summon a
    copy of a minion currently present on the battlefield, or spend <strong>2
    Charges</strong> to summon a copy of a miniboss currently present on the 
    battlefield. The summoned unit arrives within <strong>Range:3</strong> of
    you and has HP equal to your HP at the time you summon it. It acts 
    immediately after you in the initiative order and may only take a single
    action per turn. Otherwise, it is identical to the copied miniboss or minion
    and has all of their abilities and attacks. Minions with the
    <strong>Swarm</strong> tag may create a Swarm with the other units you
    control, gaining the full benefits of that Swarm.</p>
