  - sort: 400000
    name: Triumphs
    type: text
    _id: 9kQkHI1InOD0ddDx
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>A Triumph is a self-imposed challenge for one mission in exchange for a reward (pp.
        121-122).</p><table><thead><tr><th>Triumph</th><th>Challenge</th><th>Reward</th></tr></thead><tbody><tr><td><strong>No
        Gear</strong></td><td>No gear or mods can be used this mission.</td><td>1 additional Off-Grid Munitions use this
        mission.</td></tr><tr><td><strong>Bleeding</strong></td><td>You gain Bleed:1 that cannot be removed until you
        return to DIS.</td><td>Next mission you gain Healing:1 that cannot be removed until you return to
        DIS.</td></tr><tr><td><strong>Reckless</strong></td><td>You must spend all your Speed every turn; unspent Speed
        is dealt back as damage.</td><td>Gain 2 Charges of Rush: a Free action to double your
        Speed.</td></tr><tr><td><strong>Echo</strong></td><td>Enemies treat you as occupying both the tile you start and
        the tile you end your turn on.</td><td>Gain 2 resources of any type at mission
        end.</td></tr><tr><td><strong>Tethered</strong></td><td>Two players take this at once and must end all movement
        within 2 spaces of each other.</td><td>Choose Slow:1, Bleed:1 or Poison:1: attacks against creatures already
        damaged by your partner gain it.</td></tr><tr><td><strong>Magnetic</strong></td><td>Once per turn the GM may
        declare an enemy Magnetic; you move 2 spaces toward it at turn start (still Provokes).</td><td>One player gains
        Trans-Body Attraction Suite.</td></tr><tr><td><strong>Hunted</strong></td><td>The GM has 3 Charges to summon a
        chosen miniboss during your turn.</td><td>Charge-bought minibosses drop 1 resource (claim within 2
        turns).</td></tr><tr><td><strong>Volatile</strong></td><td>Your attack patterns that overlap a player character
        apply their Effects and half damage to them.</td><td>Gain Stasis-Induction Hyperforge (Aux: mark a tile of your
        next attack Lingering:1).</td></tr><tr><td><strong>Frugal</strong></td><td>You may heal 1 HP when you damage an
        adjacent creature, but no other healing except Rez.</td><td>Advance your Limit Break by 1 each turn (or restore
        1 Equipment use per round if you have none).</td></tr><tr><td><strong>Last To Act</strong></td><td>You take your
        actions after all enemy units.</td><td>Your loadout may include up to 2 options you have not
        unlocked.</td></tr><tr><td><strong>Shaded</strong></td><td>All enemy minibosses gain permanent
        Shaded:1.</td><td>+2 Speed on any turn you are or were in a Shaded
        square.</td></tr><tr><td><strong>Swapped</strong></td><td>Once per round the GM may swap you with a minion or
        miniboss.</td><td>Create an extra shared HELLPIERCER any player can transform into (Aux, once per
        TACCOM).</td></tr></tbody></table>
