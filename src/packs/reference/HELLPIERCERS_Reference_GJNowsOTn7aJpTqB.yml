  - sort: 500000
    name: Roles
    type: text
    _id: 6inho1B8XKkpHUfC
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Skopos</h2><h3>Tulpic Observation Projection <small>STRATCOM</small> <em>(2 any)</em></h3><p>Select a
        landmark on the last map you visited, then two more to draw a triangle. Any GM STRATCOM action that passes
        through or happens inside the triangle must be announced, with no detail. You may remove your spy to read the
        exact War Journal entry, which erases the triangle.</p><h3>Veil-Rending Reality Realignment
        <small>STRATCOM</small> <em>(4 any)</em></h3><p>Write down two locations. The next convoy to arrive at one of
        them actually arrives at the other. Only one pair is active at a time; reassign at the start of any STRATCOM
        phase for 4 more.</p><h3>Stratiotici Mellonsophia Manipulation Ritual <small>RECON</small></h3><p>Name three
        NPCs, two important objects and one ending. At any point during the current mission you may declare that any one
        of the six presents itself to the party.</p><h3>Crystalline-Fortified Asset Heuristics
        <small>RECON</small></h3><p>When you receive this role, choose an enemy faction. Once per mission, point to a
        location on the STRATCOM map and ask the GM 3 questions about its current situation. You may burn 2 questions to
        appear there as a psionic projection for about a minute.</p><h2>Mensor</h2><h3>Ogdoad Replication//Emulation
        <small>STRATCOM</small></h3><p>Point to a place you stopped on the map outside of Locations and place one of: an
        Empheryn Nanodrone Control Center (generates 1 Fuel and 1 Soulfire whenever visited); an 18-Hands Material
        Annihilation Sacrament (when visited, destroy it to open a one-time tunnel to another location); a Vertex-Coil
        Emergency Ephodia Distribution System (choose 4 numbered points; leaving one, roll a D4, and on a match restock
        as if you had returned to DIS).</p><ul><li>Empheryn Nanodrone Control Center: 3 Hellsteel</li><li>18-Hands
        Material Annihilation Sacrament: 3 Soulfire</li><li>Vertex-Coil Emergency Ephodia Distribution System: 3
        Brimstone</li></ul><h3>Preemptive Inventory Supplementation <small>RECON</small></h3><p>Before leaving DIS
        select two single-use items: Charonic Healing Salve (full HP; an ally also ignores the next damage), Portable
        Reality Crushing Matrix (a portal to a visited location, or six connected Void tiles in TACCOM),
        Terrain-Adaptive Restriction Embargo (destroy a Hazard), Hardlight Skyway Generating Xenoglossia (halve travel
        time, or a 3-wide bridge in TACCOM). Usable in any phase; refreshed only by returning to DIS.</p><h3>Angelhound
        Squire <small>RECON</small></h3><p>Once per STRATCOM, a machine of Angelic Metals carrying a Nephilic Seed
        matures it into a Legendary Arm of your choice. It withers after one combat
        encounter.</p><h2>Chresto</h2><h3>Magnificent Exorcism <small>STRATCOM</small></h3><p>On a conquered location
        build a Pneuma Fortifying Gnostic Beacon: Consecrated Ground at Ascendance 1 (HELLPIERCERS begin TACCOM with
        Aegis:1 or Haste:1). Using this on a location with a Beacon raises its tier: 2 = buildings can't be demolished
        or demons can't hide; 3 = between three or more Beacons, demons can't build, fortify or create map hazards, or
        HELLPIERCERS can't die within the border.</p><h3>Complete Dominion <small>STRATCOM</small></h3><p>After
        defeating a faction, co-opt their final fortress. Answer: what defenses did you keep, what is it called now, its
        biggest weakness, how do you decorate, who wants it back. Choose three tags from: Mobile, Underground, Aerial,
        Aquatic, Weaponized, Hidden, Overt, Ornate, Vulgar, Haunted, Living, Inaccessible, Scry-Proof, Labyrinthine,
        Leyline-Nexus, Non-Hylic Metamaterials. Visiting it counts as returning to DIS.</p><h3>Geometrization
        <small>RECON</small></h3><p>When delving into the Catacombs below DIS, consult your map and rearrange its layout
        however you see fit.</p><h3>Emergency Soul Triage <small>RECON</small></h3><p>Restore a human soul to its divine
        form and ask the GM two questions from: What happened here? What are they planning? What should we be on the
        lookout for? Who's in charge? What's the twist? They must answer honestly.</p><h2>Mahemikos</h2><h3>Collective
        Bargaining <small>STRATCOM</small></h3><p>Select a friendly structure and spawn a unit. Rampaging Tyrant Slayers
        move to the nearest enemy location or convoy, give its faction -1 Force and stop a convoy from moving while
        attached, then retreat the next phase. Dragon-Minded Free Hellions are a growing community with 3 Growth Boxes:
        each phase fill one to give the faction a leader, miniboss or minion, or make it friendly to humans. The
        Vengeful Unquiet let you demand a War Journal page or active project at the location and remove one progress
        mark or decoy convoy.</p><ul><li>Rampaging Tyrant Slayers: 2 Hellsteel</li><li>Dragon-Minded Free Hellions: 2
        Soulfire</li><li>The Vengeful Unquiet: 2 Brimstone</li></ul><h3>Rising Blood Of Twenty Billion Martyred Divines
        <small>RECON</small></h3><p>Whenever you revisit a location, gain 2 Charges. At any time you may declare that
        you sabotaged a piece of equipment, machine, ritual or process there on a previous visit: spend 1 Charge and say
        how, and what happens next.</p><h3>Mind-Liberating Pseudo-Ascending Activation Phrase
        <small>RECON</small></h3><p>Before leaving DIS, mark a location and write down a minion or miniboss type. In
        TACCOM there, a Support Action declares one such unit a Traitor: it switches sides, and is cooperative
        afterwards. Name it and give it a goal.</p>
