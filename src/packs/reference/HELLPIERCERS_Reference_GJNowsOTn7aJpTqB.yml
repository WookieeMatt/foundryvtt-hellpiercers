name: HELLPIERCERS Reference
pages:
  - sort: 100000
    name: Effects
    type: text
    _id: VDM7FMgI8vevaaop
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Every Effect from the Core Rules (pp. 94-95) plus the faction and equipment Effects. The TACCOM engine
        applies the automatic ones at the start and end of each
        turn.</p><table><thead><tr><th>Effect</th><th>Rule</th></tr></thead><tbody><tr><td><strong>Aegis</strong></td><td>This
        unit may count as Flying for a number of squares of their movement up to their stacks of Aegis each turn. Flying
        units move over all types of terrain unimpeded, are treated as having +1 Elevation, and do not Provoke.
        Aegis-affected units may choose to spend their Aegis flight at any point during their movement. Aegis does not
        change a unit's Speed and does not count as adding spaces of movement, only modifying existing movement. Remove
        1 stack at the end of the affected unit's turn</td></tr><tr><td><strong>Armor</strong></td><td>This unit takes
        -1 damage from each instance of damage. Remove 1 stack at the end of the affected unit's
        turn.</td></tr><tr><td><strong>Blazing</strong></td><td>This unit takes 1 damage at the start of each turn.
        Blazing spreads: any unit who begins a turn adjacent to a unit with Blazing gains Blazing:1 and im- mediately
        takes its 1 damage. Additional Blazing does not add to existing Blazing — keep the highest number of stacks from
        any one source and ignore all others. Remove 1 stack at the end of the affected unit’s turn, but only if there
        are no units adjacent to it.</td></tr><tr><td><strong>Bleed</strong></td><td>All attacks against this target
        deal an additional 1 damage. Remove 1 stack at the end of the affected unit’s
        turn.</td></tr><tr><td><strong>Bound</strong></td><td>This unit cannot inflict Effects on other creatures.
        Actions otherwise function as normal. Remove 1 stack at the end of the affected unit's
        turn.</td></tr><tr><td><strong>Compel</strong></td><td>This unit forces enemies within a range equal to its
        stacks to attack it during their turn, if able. Compel:1 affects all units that start their turns adjacent or
        become adjacent and each additional stack increases the range by 1 square. Remove 1 stack after each
        attackagainst the affected unit.</td></tr><tr><td><strong>Countdown</strong></td><td>Countdown does nothing
        until the Effect ends, at which point it triggers a special effect based on the source of the Countdown. Remove
        1 stack at the end of the round.</td></tr><tr><td><strong>Enrage</strong></td><td>This unit must attack a unit
        with Compel if possible, including attacking an ally. It can only take attacks that do not target a unit with
        Compel after making an attack that does, unless no unit has Compel. Remove 1 stack at the end of the affected
        unit’s turn.</td></tr><tr><td><strong>Haste</strong></td><td>This unit may make one additional Action of any
        type during their turn. Remove 1 stack after the additional action has been
        taken.</td></tr><tr><td><strong>Healing</strong></td><td>This unit restores HP equal to their Healing value at
        the end of their turn. When this Effect is applied to a tile, a unit standing on it is considered to have the
        Effect at the tile’s number of stacks. A unit buffed with Healing:2 will restore 2 HP at the end of their turn
        regardless of where they move; a Healing:3 tile will then also restore 3 HP to that unit if they end their turn
        on that tile. These Healing Effects resolve separately if a unit is subject to both. This cannot increase a
        unit’s max health beyond its default max HP. Remove 1 stack from each source of healing at the end of the
        affected unit’s turn.</td></tr><tr><td><strong>Pin</strong></td><td>This unit cannot move or Sprint. Remove 1
        stack at the end of the affected unit’s turn.</td></tr><tr><td><strong>Poison</strong></td><td>This unit takes 1
        HP damage per stack at the end of their turn. After Poison’s damage is dealt, remove 1 stack of
        Poison.</td></tr><tr><td><strong>Shaded</strong></td><td>Creatures with Shaded:1+ are surrounded by a Burst:1
        “fog of war” effect, hiding enemies and their movements from players. Players can only see enemies within a
        Shaded zone if they are adjacent to them. Shaded zones move with the unit or affected space unless stated
        otherwise. Each additional stack of Shaded increases the scale of the burst to the same number. Remove 1 stack
        at the end of the affected unit's turn.</td></tr><tr><td><strong>Shock</strong></td><td>This unit’s actions are
        treated as one tier higher than their action type — Aux Actions count as Support Action, Support Actions count
        as Main Actions, and Main Actions are impossible. Remove 1 stack at the end of the affected unit’s
        turn.</td></tr><tr><td><strong>Slow</strong></td><td>This unit’s movement costs are doubled. Remove 1 stack at
        the end of the affected unit’s turn.</td></tr><tr><td><strong>Transference</strong></td><td>This unit heals
        itself, or this attack heals the attacker, for HP equal to any damage they inflict. Remove 1 stack at the end of
        the affected unit's turn.</td></tr><tr><td><strong>Broken</strong></td><td>All attacks against this target deal
        maximum damage. Remove 1 stack after each attack against the affected
        unit.</td></tr><tr><td><strong>Fortified</strong></td><td>When a HELLPIERCER unit begins its turn on a tile with
        Fortified, remove the Effect and restore 2 Reversal Charges to that unit.</td></tr><tr><td><strong>Pain
        Aura</strong></td><td>This unit projects a Scale:2 field around them that causes 1 damage to any units ending
        their turn within it, regardless of allegiance. Remove 1 stack at the end of the affected unit's
        turn.</td></tr><tr><td><strong>Frozen</strong></td><td>The affected unit cannot use Aux Actions. Hitting a
        Frozen target triggers Shatter, which replaces the attack's damage and effects and clears all Frozen. Ticks down
        at the end of the affected unit's turn.</td></tr><tr><td><strong>Wound</strong></td><td>A mark of CAIM's
        vengeance. Wounds do not tick down and last until the TACCOM encounter is over or a Metricos ability spends
        them. Whenever a Metricos unit applies an Effect it also applies
        Wound:1.</td></tr><tr><td><strong>Wrack</strong></td><td>The next attack against this unit cannot roll any
        damage die lower than its Wrack value (never above the die's maximum), then all Wrack is
        cleared.</td></tr><tr><td><strong>Constrict</strong></td><td>This unit may not move on their turn, and takes
        additional damage from all sources equal to its Constrict
        stacks.</td></tr><tr><td><strong>Brand</strong></td><td>When the Brand reaches 0, the Branded creature or object
        explodes, dealing 4D6 damage to the target and 6 damage to all adjacent targets. Remove 1 stack at the end of
        the round.</td></tr><tr><td><strong>Retaliation</strong></td><td>Gained when attacked while in a riposte stance.
        Spend stacks to empower your next counter-charge. Lose 1 stack when you end a turn outside the
        stance.</td></tr><tr><td><strong>Retrieve</strong></td><td>When this unit is attacked it may spend 1 stack to
        move adjacent to its anchor, or move the anchor adjacent to
        itself.</td></tr><tr><td><strong>Rush</strong></td><td>Spend a stack as a Free action to double your Speed at
        any time during your turn.</td></tr><tr><td><strong>Magnetic</strong></td><td>At the start of the affected
        unit's turn, creatures linked to it move 2 spaces toward it. This is not regular movement and costs no Speed,
        but still Provokes.</td></tr><tr><td><strong>Snakeskin</strong></td><td>The unit takes 0 damage from the next
        attack targeting it, then loses Snakeskin.</td></tr><tr><td><strong>Glassflesh</strong></td><td>The target
        receives double damage from the next attack targeting them. The status lingers on the space where a unit dies
        and is picked up by the next enemy to enter it.</td></tr><tr><td><strong>Agnosia</strong></td><td>This unit has
        reached its Agnosia threshold and may use its single-use Agnosia move.</td></tr></tbody></table>
