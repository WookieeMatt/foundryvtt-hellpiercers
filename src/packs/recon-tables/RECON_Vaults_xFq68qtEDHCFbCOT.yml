    type: text
    name: A single plinth, surrounded by a small moat of…
    img: null
    description: >-
      <p>A single plinth, surrounded by a small moat of glittering silver water direct from the abyssal ocean
      of the Demiurge. Crossing it grants HELLPIERCERS one memory from before the great forgetting. The plinth
      holds the embryonic form of a nascent Demon Lord, its crown still in flux, its single red eye searing a
      vengeful rune into the eye of anyone brave enough to stare back. This is only part of an animus; it
      yearns to fuse with power, to trigger something magnificent and obliterative. It dreams of a new status
      quo, and its dreams bleed into any HELLPIERCER who stands close. Grant one player the following
      ability:</p><p><em>As a Support Action, once per TACCOM select one enemy, then declare which HELLPIERCER
      they will target next. That enemy cannot make any attack besides one that targets that HELLPIERCER until
      it fulfills this prophecy.</em></p>
