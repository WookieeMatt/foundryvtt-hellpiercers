    type: text
    name: Entry into this vault catapults the wanderers into an…
    img: null
    description: >-
      <p>Entry into this vault catapults the wanderers into an incomprehensible miasma of souls. Physicality
      washes away. All sense of stable space, even the understanding of it, struggles and fails against an
      onslaught of a stranger space. Lives, goals, ideals, memories, dreams, entire persons play out across
      impossible shapes that transgress through what little body exists of the entrant. A HELLPIERCER could
      escape this, and would carry some mote of value with them, but extracting this many souls from a chamber
      of guf requires specialized equipment. Why were they put here in this prison-within-a-prison in the
      first place?</p>
