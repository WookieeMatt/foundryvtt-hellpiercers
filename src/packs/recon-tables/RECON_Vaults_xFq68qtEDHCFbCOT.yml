    type: text
    name: This chamber is designed around a number of sapphire…
    img: null
    description: >-
      <p>This chamber is designed around a number of sapphire and garnet sarcophagi—one for each member of the
      squad. Resting in these grants the sleeper inescapable prophetic dreams, full of potent images of
      crowns, of a white moon and a broken red planet, of the rotting corpse of the Demiurge and a million
      demons marching through his watery grave. One of you awakens holding a weapon. The rest of you know the
      shape of a terrifying apocalypse to come.</p>
