  - _id: lFBENf3vSgHgC8YQ
    type: text
    name: Past the threshold of the vault the HELLPIERCERS forms—their…
    img: null
    description: >-
      <p>Past the threshold of the vault the HELLPIERCERS forms—their golden skin, their nouswork armor—melts
      into a stunning mundanity. Their flesh prickles in the cold, their eyes strain against the dark, and the
      thrumming call of power behind their minds ebbs into a low buzz. Here, they are as Human as they have
      ever felt. The center of the room holds a chamber with a primordial Armor, forged by an anonymous, long
      dead demon artisan from the corpse of an undocumented Archon. It has the following
      stats.</p><p><em><strong>Speed</strong> : 5 <strong>Special Movement</strong> : Keppler-Aristotelian
      Unified Graviton Rite At any point in your movement, you may place a Void Attractor tile. By default,
      the tile has a Burst:1 range, Attractor:1 strength, and must be placed within Range:2 of your current
      location. You may spend any or all of your remaining Speed to increase any of these values. You can
      dismiss this tile at any point during your turn. You may only have one Void Attractor tile active at a
      time. <strong>Armor Action</strong> : Particle Interchangeability Module - As a Support Action, you may
      change the direction of the Void Attractor tile’s attraction, changing its Pull effect to a Push. Using
      this ability also makes your Attractor tile affect any damage patterns that fall into its Burst range.
      Each time it is worn, it regains one more of its memories of Heaven, of ruling here in Hell, and of the
      pathway to its own liberation. It will pursue this goal relentlessly.</em></p>
    weight: 1
    range:
      - 11
      - 11
    drawn: false
    flags: {}
