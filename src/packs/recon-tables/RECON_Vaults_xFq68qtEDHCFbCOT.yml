    name: A single, plain jar rests in the center of…
    img: null
    description: >-
      <p>A single, plain jar rests in the center of an otherwise empty and bland tomb. When taken back to DIS
      and researched, it reveals itself to be a Demon Binding Pot, and adds the following action to the
      HELLPIERCERS abilities:</p><p><em>As a Main Action, select an active enemy within this TACCOM encounter
      and place a <strong>Countdown:3</strong> on them. At the end of the countdown, that enemy is permanently
      sealed within the pot and can only be released by breaking it. If broken, the enemy de livers one of
      their attacks at a target of the players choosing before vanishing forever. Discuss with the table how
      the attack works beforehand.</em></p>
