    type: text
    name: As the locks on this vault roll back into…
    img: null
    description: >-
      <p>As the locks on this vault roll back into hidden dimensions, the door unfurls like a flower then
      turns rotten, its petals sloughing off into wet lumps of gooey mess. A red mist seeps from the open
      doorway, followed quickly by a cyclone of hellish miasma. The vault is empty but for a half-ruined
      effigy of a twisted Archon, half-fused with some demonic creature. <strong>Be fore the next session, sit
      down with the table and develop an entirely new faction rep resenting one of the Archon’s Hellguard
      fused with demons.</strong> Create at minimum a Faction Boss, a miniboss, and at least one minion. These
      creatures may be deployed by the GM during any future missions.</p>
