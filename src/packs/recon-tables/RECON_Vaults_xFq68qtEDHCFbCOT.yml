  - _id: D0nXaUvXKqVrN40o
    type: text
    name: The vault appears from the outside as a treasure…
    img: null
    description: >-
      <p>The vault appears from the outside as a treasure trove of Hell’s wealth. The arrayed riches of some
      elder faction lay piled atop strange weapons and inscrutable ritual aids. Upon entering, this illusion
      fades away. This bunker contains books, tablets, scrolls, and rudimentary technology preserving the work
      of Edenite Monks who led the Hosanna protocol, the effort to carry the knowledge of ascension through
      the thousand years of fire. Those who died forged this safe vault in Hell and continued their
      divine-beyond-divine mission. Their work is impenetrable, and changes focus every few centuries as the
      monks set their wisdom against archons, demons or internally, seeking some escape from Hell. Select one
      of the following rituals to pursue and determine the catalyst, the archonic source, and the hylic
      resonance needed to complete it:</p><p><em>Allows a single Legendary Arm to be made a permanent addition
      to the squad’s weapon options.</em></p><p><em>Uncovers a further layer of Truth to the universe,
      enlightening the HELLPIERCERS beyond their cosmic liberation, past the Hebdomas and the Monad, to a
      realm of com plete understanding. Completing this ritual requires a living Faction Boss, the fused cores
      of an ascended human and some other alien power, and a weapon capable of breaking the Keter-Lokantara
      barrier. It immediately annihilates all the active fac tions and unmoors local reality. Discuss with the
      table what happens next.</em></p>
    weight: 1
    range:
      - 12
      - 12
    drawn: false
    flags: {}
