    img: null
    description: >-
      <p>The vault contains only the flayed torso of some immense creature. Its blood is gold, its skin a
      shattered mirror of silver and bronze. The creature's broken ribcage houses an emerald roughly the size
      of a car. Touching it reveals to all present a ritual for diving their pneuma into it and the machine
      needed to do so. Its representative begins to haunt the party, seen on distant walkways, meeting with
      moribund characters.</p>
