    type: text
    name: Somehow, a building from the ogdoad has laid under…
    img: null
    description: >-
      <p>Somehow, a building from the ogdoad has laid under the catacombs of Hell for millenia. Oddly colored
      flesh, bright hot red, is gilded with immaculately polished gold. Dazzling terminals sprawl endless
      flowing Heaven-Code, sentient programming endlessly pursuing some unknown project. The bulk of the vault
      is a massive pit holding a pale humanoid giant bound by golden chains. Its head has been removed,
      replaced with an enormous golden Lion mask caught in a vicious snarl. High above the creature is an
      unnerving halo, swirling with unidentifiable soul-matter.</p>
