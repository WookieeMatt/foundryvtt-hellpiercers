  - _id: gofYyVn9wyiq81lb
    type: text
    name: Every surface of the vault is covered in a…
    img: null
    description: >-
      <p>Every surface of the vault is covered in a bizarre, beautiful mycelium. The strange non-Euclidean
      structures shift with an unseen, unheard, irregular heartbeat that sends pulses of golden light through
      the silvery flesh of the fungi. The ground underfoot is soft and yielding, the smell earthy but with a
      fizzy hint of divinity. The walls are marked with ancient, decaying anti-divinity seals in a variety of
      demonic languages. Several towers of mycelium dot the area, and when communed with readily accept a
      spinther into them for communion. Whoever returns holds the One Last Minute Legendary Arm. Only beings
      with souls would find themselves in such a cell, and only beings who have tested the bounds of divinity
      warrant this security.</p>
