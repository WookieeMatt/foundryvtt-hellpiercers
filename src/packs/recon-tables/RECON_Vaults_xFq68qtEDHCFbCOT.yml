  - _id: 5YwFDAqaYIqJGfYg
    type: text
    name: Stepping into this vault is like being in the…
    img: null
    description: >-
      <p>Stepping into this vault is like being in the center of every loudspeaker and subwoofer in the world,
      blasting a wall of noise that threatens to unmake your body and soul. Your AT Field flares, layering
      upon itself, separating you from your relationships, your connections, all but your nous, spinther, and
      pneuma. This is what it is to be a demon. Within these ironclad walls you are a master of your own
      psyche, but the barriers between yourself and others feels unbreakable. A weapon beckons from the raised
      platform in the center of this room, where the noise is strongest.</p>
    weight: 1
