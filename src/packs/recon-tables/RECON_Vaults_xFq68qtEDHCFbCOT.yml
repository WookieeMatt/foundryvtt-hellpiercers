  - _id: tmADhx8Q116RdHcf
    type: text
    name: It is completely dark here. No light enters, no…
    img: null
    description: >-
      <p>It is completely dark here. No light enters, no light escapes. The ground beneath the HELLPIERCERS is
      wet. A cold white moon hangs lifelessly in the distance. On it, a strange network of ruins, fissures,
      and craters tell a morose story. The soul of the Demiurge, its true soul, the one you drove a sword
      through at the mountain of humanity's birth, is in there. Every atom in your body knows it. Any exertion
      of will in this room parts the dark ocean below the HELLPIERCER, a diamond core rising to meet them.
      Unlock the following Vehicle Options:</p><p><strong>Personalization - Exalted Idiot Creator Of All That
      is</strong></p><p><em>Vehicle gains the personality and memories of the Demiurge, the naive monster who
      wrought all pain in the universe in an ignorant search to emulate its mothers
      love.</em></p><p><strong>Upgrade - Wings of Infinite Light</strong></p><p><em>The vehicle gains
      collapsible wings of emerald-purple-golden light. These wings al low semi-effortless vertical ascension,
      and can themselves open temporary rifts in the local reality matrix. Consume 1 Fuel when deployed. Grant
      the vehicle the temporary tag Active-Arrested Pseudo-Evolution Catalyst until returning to
      DIS.</em></p><p><strong>Upgrade - Final Rage Directing Giga-Art</strong></p><p><em>When combined with a
      ritual catalyst such as a fruit of wisdom or a legendary arm, the vehicle begins a cataclysmic ascension
      rite that transforms the vehicle into an in domitable giant of darkness. The ritual ends with its total
      annihilation, and the anni hilation of an area roughly 2 Speed across on the STRATCOM. This ascension
      funda mentally changes the rules of the local reality matrix. Decide among your table how this plays
      out.</em></p>
