  - _id: OTbvTW61lpxFfO84
    type: text
    name: A twisted chamber of throbbing volcanic glass and obsidian…
    img: null
    description: >-
      <p>A twisted chamber of throbbing volcanic glass and obsidian curves. Every word spoken here prompts a
      mocking retort from somewhere out of eyesight. Reflections display perverse mockeries of those who cast
      them. Smooth surfaces pierce like knives and sharp edges are dull to the touch. The spirit who forged
      this room was a sadist beyond compare. Destroy a single structure you have built in Dis and do not
      recover its building materials. The spiteful echo writhes in glee. Select any building that has been
      identified from an enemy faction. Destroy it.</p>
