    type: text
    name: Gnarled trees and coiled vines force a tempered approach…
    img: null
    description: >-
      <p>Gnarled trees and coiled vines force a tempered approach to the center of this vault. A dome of green
      grass is crowned with an impossible tree, one of swirling golden boughs and emerald and ruby leaves
      which clink and tinkle in the non-existent wind. Strange fruits hang from its branches, each with an
      alien face. A great lion-headed serpent lies sleeping around the tree. Upon approaching, an androgynous
      figure clad in gold emerges, calling itself Adam-Eve. It offers you a weapon. Decide together what the
      cost will be.</p>
