  - _id: hBwO7t8GVpeGXAkR
    type: text
    name: This chamber is as close to Earth as you…
    img: null
    description: >-
      <p>This chamber is as close to Earth as you have felt since you walked the hero's mimesis ritual back
      home. The vault resembles the dionysian chambers where you first learned to see the hidden path. Time
      stops outside of this chamber, you can watch motes of reality juddering and shivering in place past the
      threshold. The air here is heavy with some imitation of Hyper-LSD, its telltale camphor scent singing
      your nostrils. Meditate here and share your experience. The one of you who spends the longest here gains
      the following tag:</p><p><em>Mantling the demonic perversion of the divine acids has fractalized your
      nous and given you paths beyond the road ahead. At any time, you may bring any number of peo ple back to
      the hall you were enthroned, but you can’t leave with more than you car ried in with you. You also see
      the waking lines of hyper-reality, fueling demonic security systems and defenses through their backdoor
      to Psi-Space, and may manipulate them with enough time and space for a suitable ritual.</em></p>
    weight: 1
