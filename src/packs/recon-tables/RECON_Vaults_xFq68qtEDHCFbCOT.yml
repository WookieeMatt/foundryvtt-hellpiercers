  - _id: gEcjeKfwriHMn4lL
    type: text
    name: Some sort of long-abandoned demonic spying system. Tendrils of…
    img: null
    description: >-
      <p>Some sort of long-abandoned demonic spying system. Tendrils of techno-organic material twist and coil
      around a room that appears to be breathing, thinking, feeling. Any one of these tendrils will connect
      you to a listening station somewhere in deep space, monitoring the comings and goings of Enlightened
      Humanity's vast population, dancing their ineffable routines through the star clouds of the outerworlds.
      Their music is transcendent. Perhaps that’s why this place was abandoned in the end. The party gains the
      following ability:</p><p><em>After a successful mission, but before returning to DIS, place a beacon at
      your current location on the STRATCOM map. You may spend this beacon to fully embody a sentient being
      within 1 Speed of that location for up to 24 hours. You gain some of that being’s re cent memories,
      their mannerisms, their drives, their will, and their goals. You cannot act in a way unbecoming for that
      being, but you retain all knowledge gained during your excursion. You may only have one beacon active at
      a time.</em></p>
