    type: text
    name: Opening the ornate door of this vault triggers a…
    img: null
    description: >-
      <p>Opening the ornate door of this vault triggers a hidden mechanism, sending the entire room spiraling
      upward. It drills through ten thousand layers of history to crest within DIS itself. Within are
      thousands of scrolls, carvings, tapestries, tablets, tomes, memory-coded bacterium, and audio logs
      cataloging every failed prophecy there has ever been. Whenever you spend a few hours here, write down 3
      things that will absolutely never, ever happen. Should any of these three things come to pass, rewrite
      events such that they do not.</p>
    weight: 1
