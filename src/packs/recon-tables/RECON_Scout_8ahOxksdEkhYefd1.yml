    description: >-
      <p>The party discovers an incongruity up ahead. A replica of a small town on Earth from another century
      sits in a little valley. The inhabitants claim to be human but are very much not, and they will fight to
      the death if you attempt to seize anything from the town. Feel free to put on a charming regional accent
      when speaking for the demons in this area. Shortly after arriving, hostile demons begin to attack the
      town from the opposite direction.</p>
