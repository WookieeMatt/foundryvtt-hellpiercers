    name: Any HELLPIERCER with Truth-Seeking Eyes can see a different…
    img: null
    description: >-
      <p>Any HELLPIERCER with Truth-Seeking Eyes can see a different angle to this location. If one looks
      katawardly, another faction’s building has overlaid itself with this one across a seventh spatial
      dimension. It shouldn’t be too hard to navigate both at the same time in a practical sense, but it makes
      any objective here much more complicated. Select a building from a faction not in active play. At any
      point, players may move between these buildings by walking in a kataward direction. Taking a dosage of
      Hyper-LSD or descending into a ritual trance also does the trick.</p>
