  - _id: zgH7aSbkBmRBdTGn
    type: text
    name: A procession is approaching from another direction, but not…
    img: null
    description: >-
      <p>A procession is approaching from another direction, but not a hostile one. Eyeless giants bearing
      immense gold palanquins trudge, without word, along a depressed ravine in the soil they themselves
      stomped out over centuries of unceasing march. Most of the platforms are empty, their skeletal riders
      holding wisps of reins or dangling by threadbare silks from the seats. One near the back has been
      converted into a cargo hauler for a makeshift merchant caravan, the giants slowly making their way
      between several "unholy" sites operating on instructions long forgotten. The merchants are hesitant to
      speak, but are not meaningfully armed. If the party seems willing to trade, they can be convinced to
      give some tidbits of info on the region, perhaps revealing a location or the local Boss' recent
      endeavor.</p>
