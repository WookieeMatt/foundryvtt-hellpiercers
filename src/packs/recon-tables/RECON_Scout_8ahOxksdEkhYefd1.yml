    name: As you begin your approach, the sky darkens. Syzygos…
    img: null
    description: >-
      <p>As you begin your approach, the sky darkens. Syzygos turns to face you, her cracked face leaking a
      strange ethereal white light that spreads out from the shattered and ruined planetoid like a spider's
      web. Lashes of purple plasma arc around the blackened stone. Within a second or two, all light seems to
      have vanished from the sky but for the strange halo crowning the fallen sister. It is pitch black now;
      you can hear the screams of the demonic forces, panicking somewhere within the complex.</p>
