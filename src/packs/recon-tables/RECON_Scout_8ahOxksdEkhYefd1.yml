  - _id: SeTNLBynfpjGM22B
    type: text
    name: An enormous ritual altar lies ahead. On closer inspection,…
    img: null
    description: >-
      <p>An enormous ritual altar lies ahead. On closer inspection, things look out of place. The incongruent
      markings of several different traditions sprawl in gibberish lines, sealing circles lie broken or
      incomplete, and the priest guiding the ritual is merely a lesser demon using a flimsy glamor to pretend
      to be a Prince thought long dead. It won't take long to figure out that they are attempting—attempting
      is the key word here—a ritual of great power. All they know, however, is what they've pieced together
      from ancient tomes and mere observation from a distance. Helping them is probably a bad idea.</p>
    weight: 1
