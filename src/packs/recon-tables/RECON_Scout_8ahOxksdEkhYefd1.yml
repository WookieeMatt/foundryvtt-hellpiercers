    type: text
    name: This place is ruined. It’s been abandoned and hollowed…
    img: null
    description: >-
      <p>This place is ruined. It’s been abandoned and hollowed for decades at least. Shriveled skeletal forms
      little the hallways. Malfunctioning tech and rotten demonic fixtures draw the HELLPIERCERS deeper and
      deeper into the dark, empty facility. For all TACCOM scenes in this facility, cap all enemy HP to 1,
      representing the skeletal and spectral nature of the foes. HELLPIERCERS may uncover a strange ritual
      experiment, an angelic corpse with bones of black stone or a pocketed hylic dimension locked in stasis.
      After they uncover this or some other baffling truth, time begins to flow in reverse in this cursed
      location, with the failure of the experiment rippling back inwardly, reviving the demonic legions
      inside. Restore enemy HP to their defaults during following TACCOM scenes.</p>
