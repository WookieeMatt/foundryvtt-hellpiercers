    description: >-
      <p>The Corpse-Engine of a Hell Titan is plainly visible, lashed and constrained behind the next point of
      interest. These monsters were weapons of cosmic destruction in long past eras, when man still cloaked
      themselves in gold. How this faction came to possess one, how they’re made, how many of them are left
      and who has them are all good questions to ask while exploring the next location; it’s all but certain a
      faction boss will end up activating the Corpse-Engine at some point during the assault.</p>
