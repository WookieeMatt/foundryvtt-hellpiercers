  - _id: CqOD86zfHOKCqMAo
    type: text
    name: A camp lies on the horizon, the inhabitants armed…
    img: null
    description: >-
      <p>A camp lies on the horizon, the inhabitants armed with nought but broken, rusted weapons and magics
      that spark more than they scorch. A dozen banners of armies long dead or never existed fly from their
      shabby tents. They are on guard, but a terrible sense of resignation reigns over the soldiers. They are
      the Faithless, a mercenary company who are damned to wander from master to master, every cause they
      attach themselves to giving them another defeat but continued existence. They cannot die, they cannot
      rest, yet they cannot win. They will reject almost any offer of cooperation or charity. They might offer
      information, and some of it might be useful. Perhaps they hold a cherished relic of a better day. It
      won't take much to get them to part with it; what good would it do them?</p>
    weight: 1
    range:
