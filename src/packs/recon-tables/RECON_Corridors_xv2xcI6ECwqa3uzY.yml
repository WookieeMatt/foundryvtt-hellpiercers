  - _id: o2N2dVxavCdudBb6
    type: text
    name: Something resembling a gilded theater of a splendored age.…
    img: null
    description: >-
      <p>Something resembling a gilded theater of a splendored age. Three tiers of extravagant seating face a
      titanic stage, surrounded by dozens of reliefs celebrating forgotten Gods, Archon achievements in human
      suffering, and gleefully illustrated legends of demonic torture. Everything is covered with a thick
      layer of scorched soul-ash, carrying the whispering screams of still-burning souls. The ancient
      soul-wood of the stage swirls a million faces of pain, and in the center, illuminated by an ethereal
      light, is a small black crown with a single red jewel embedded in its center. The crown fits whoever
      wears it; it is a violation of gnosis, but all freedom is violation to someone. It will not be removed
      easily.</p>
    weight: 1
    range:
