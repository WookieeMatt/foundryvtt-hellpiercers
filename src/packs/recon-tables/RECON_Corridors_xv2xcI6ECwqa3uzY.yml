    type: text
    name: The walls of this hall are thick with vines…
    img: null
    description: >-
      <p>The walls of this hall are thick with vines and ancient, dying plants. Yellow-brown rot and misty
      spore clouds cloud the senses. A single break in the ceiling shines the red-black light of Hell’s sky
      onto a single, disheveled Welwischia plant—the last of its kind here, or anywhere else. Once a powerful
      being by Abigor’s side, they were cast down here after the Syncrasis ascendence. Its voice is gentle,
      but furious.</p>
