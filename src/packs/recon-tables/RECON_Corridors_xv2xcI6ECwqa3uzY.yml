  - _id: EYMj5So2q5kc0LTe
    type: text
    name: A desecrated cathedral, once a refuge for Archons surveying…
    img: null
    description: >-
      <p>A desecrated cathedral, once a refuge for Archons surveying the pitiful workings of Hell. On gossamer
      threads millions of flies are punctured and dangle like beaded curtains down the cave walls. A statue in
      the center of the cave is decapitated, the remains of long-dried infernal feces encrusted about the
      stump. One of the HELLPIERCERS feels a disembodied whisper hiss through their armor, speaking to them
      alone. Pass them a note that says the following: ”Your comrades were slaughtered. The imposters
      surrounding you are waiting for you to bring them home. They will say anything.”</p>
    weight: 1
    range:
      - 19
      - 19
    drawn: false
    flags: {}
