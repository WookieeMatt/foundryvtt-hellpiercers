    type: text
    name: A pale, emaciated, and ghostly figure is weeping and…
    img: null
    description: >-
      <p>A pale, emaciated, and ghostly figure is weeping and lapping water from a crack in the far wall. They
      wear a faded gold sash around their body, bearing the near-illegible sigil of the House of Ekklesia. In
      the folds of their robe are baubles and inscrutable treasures from a lost age. They are hesitant to
      speak, as each word causes their tail to grow toward the hidden exit of the room.</p>
