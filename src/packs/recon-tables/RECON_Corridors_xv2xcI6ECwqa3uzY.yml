  - _id: 5GhcouUw55tSIPeK
    type: text
    name: The remains of a ritual summoning space adorned with…
    img: null
    description: >-
      <p>The remains of a ritual summoning space adorned with the tapestries and ceremonial items of an active
      demonic faction. The ritual was hastily abandoned and could be completed by the party. Determine three
      esoteric steps—ring the bell, close the book, dash the candles, or similar—and scatter the elements
      throughout adjacent chambers, vaults, or corridors. When the ritual is complete, select one of the
      following and summon them within the sealed circle: an ancient wizard from the first human ascendency,
      clutching a brick of Babel-Gold; the jealous and vengeful sister of the current faction’s leader; or the
      torn gold and silver spirit of an Archon full of impotent fury.</p>
