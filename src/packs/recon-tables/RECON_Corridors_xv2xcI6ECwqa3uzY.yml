  - _id: mVaHGo1HHJrsSkJe
    type: text
    name: This chamber of ice stuns even HELLPIERCERS with a…
    img: null
    description: >-
      <p>This chamber of ice stuns even HELLPIERCERS with a cold shock. A frosty mist impedes easy access, but
      will yield to the players’ power. The walls of the chamber stretch up impossibly high and are etched
      with sentient sigils that seem to writhe against comprehension. In the center of the room is a corpse of
      Saklas, its lion-headed skull almost cycloptic with a strange third eye socket in the center of its
      crown. Its bones are carved with a record of the 148 Sufferings and representations of Jupiter. An altar
      seems to grow organically out of these bones, surrounded by braziers of unearthly metal and obsidian
      obelisks. A heavy dagger, a bloodstone bell, and a golden mask covered in unblinking eyes promise
      audience with Syzygos.</p>
    weight: 1
    range:
