  - _id: zpWBzPVNQ92mImrN
    type: text
    name: The chamber is lined with stone eyes, which turn…
    img: null
    description: >-
      <p>The chamber is lined with stone eyes, which turn into real eyeballs when approached. The eyes are
      majority human, but scattered through are demonic eyes, angelic eyes, eyes with spiral patterns or
      burning crosses in them. In the center of the chamber is a stone orb about six feet across. When
      approached, it forms into the non-Euclidean, two-dimensional eyeball of the Paracletus’s leader. Through
      ritual, surgery, or both, it can be implanted into the head of a HELLPIERCER, allowing them to see into
      the second dimension and observe the Paracletus’s true forms. If the Paracletus faction is not in play,
      they join the war as an additional faction upon installing the eye.</p>
