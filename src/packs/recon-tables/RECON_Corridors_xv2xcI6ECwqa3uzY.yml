    type: text
    name: It dawns on you that the walls of this…
    img: null
    description: >-
      <p>It dawns on you that the walls of this chamber are the enormous bat-like wings of some unthinkably
      vast creature. Its spine curves up and around the end of the corridor, its blackfurred body blocking any
      exit. Two spindly arms emerge from the darkness and lay themselves flat on the ground on either side of
      a small game board, laid on the floor The game is morelles or Nine Men’s Morris. The creature does not
      speak, and makes no interpretable sign of intelligence beyond responding to player moves. Winning opens
      the door behind the creature, who allows them to walk through unimpeded. A certain arrangement of pieces
      opens a special door to a random Vault. Losing will cost someone dearly.</p>
