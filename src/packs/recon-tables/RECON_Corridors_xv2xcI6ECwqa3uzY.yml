  - _id: ppFTWQHrG04hHvGs
    type: text
    name: The vaults and hallways surrounding this passage are wet.…
    img: null
    description: >-
      <p>The vaults and hallways surrounding this passage are wet. They’re covered in barnacles, seaweed, and
      the ruins of broken ships bearing the emblem of the Sea People. If the MIXIS Faction is in play, mention
      its similarity to the banners they carry. The door opens to reveal a solid wall of water, suspended in
      place by magic. The hallway is home to thousands of extinct fish, who flow through you, sharing memories
      of a long forgotten Earth. HELLPIERCERS heal to full HP after sharing a fish memory. Their memories are
      ones of impossible war, of blind children playing with the weapons of Gods, of half-enlightened warrior
      kings leading armies of hastily uplifted seabourne kin.</p>
