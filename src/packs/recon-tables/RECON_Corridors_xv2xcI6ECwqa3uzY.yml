  - _id: eFax8C9omSVO9ZPW
    type: text
    name: A terrifying visage, a bandage-wrapped skull with a single…
    img: null
    description: >-
      <p>A terrifying visage, a bandage-wrapped skull with a single green-purple eyeball dominates the room.
      Hot air flows from its nostrils, despite its clear decomposition. Shoulders seen through cracked
      flooring reveal the figures restraining armor, scored with innumerable names of ancient hellions and the
      sigils of at least a dozen Archons. This creature will greedily devour the cores of ritually important
      objects (Faction Leader crowns, Forbidden Arms, HELLPIERCER Spinthers), and grows in strength and
      prophecy with each one, changing the world and its rules according to an inscrutable design. It will
      only ever tell you truths, but never welcome ones. Once it has a crown, a sword, and raiment, its
      bindings will no longer hold it.</p>
