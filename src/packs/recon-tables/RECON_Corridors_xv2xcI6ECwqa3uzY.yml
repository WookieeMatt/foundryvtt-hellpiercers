    name: A massive 12-legged, 12-mouthed beast drenched in crimson lies…
    img: null
    description: >-
      <p>A massive 12-legged, 12-mouthed beast drenched in crimson lies across the corridor, blocking the
      path. Its multiple mouths twist back into toothy grins. Each mouth contains a small room, entered by
      crawling past its teeth. Each room contains the soul of a person the PCs have lost. Only two can be
      retrieved, but they all seem quite content.</p>
