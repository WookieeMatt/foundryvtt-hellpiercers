  - _id: fSuzK3X0StzsZcxR
    type: text
    name: The song of hammers striking metal fills your minds.…
    img: null
    description: >-
      <p>The song of hammers striking metal fills your minds. Each blow solidifies in you an everstronger
      image of an arm being forged. Your every footfall drives in sync with the pounding of the forge-hammer.
      A curling dome of a building can be seen nearby. You know this to be the seat of the forge. Hellsteel
      fingers curl above the anvil at the building’s center, shading it from the sun of Hell. Though the sound
      of creation rings so loud in your heads as to be overwhelming, the forge before you lays still—fires
      unlit, bellows inert, no metal to be forged.</p>
    weight: 1
