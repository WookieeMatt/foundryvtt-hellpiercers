    name: A sprawling shrine is carved into a mountainside. Rambling…
    img: null
    description: >-
      <p>A sprawling shrine is carved into a mountainside. Rambling tales carved into the walls over eons
      speak of the multitude of Architects of Adam, their names, the particular parts of the body each one
      created, the ways they were arranged, and the one part which, in their ignorance, they stole from him.
      The shrine was built to house and contain this esoteric organ.</p>
