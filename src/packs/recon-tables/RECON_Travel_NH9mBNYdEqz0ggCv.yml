    type: text
    name: Railway tracks rise up from the unnatural dirt beside…
    img: null
    description: >-
      <p>Railway tracks rise up from the unnatural dirt beside your road. An infernal engine, twisted from a
      million trapped souls, thunders across the landscape in roughly the same direction as your party. A
      cabal of warlocks gathers on an open-air carriage somewhere in the middle, conducting a symphony of
      sorcery. Flames belch from its wheels, and the howl of Dragon- Hearts sends shivers through the haunted
      ceramics of the HELLPIERCERS armor.</p>
