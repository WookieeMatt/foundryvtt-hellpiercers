    name: Makeshift towers and the skulls of slain warlords mark…
    img: null
    description: >-
      <p>Makeshift towers and the skulls of slain warlords mark this rudimentary highway. A tattered flag
      warns that you are entering a Psychic-Liberation Zone. These humans reject metanoia, yet still fight
      against Hell here in its warhold. More and more of these are being reported after the fall of DIS. The
      humans here despise the pneumatic, and will not treat you with hospitality.</p>
