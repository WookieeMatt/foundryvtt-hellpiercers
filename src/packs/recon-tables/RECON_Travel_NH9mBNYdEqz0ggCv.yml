    name: A woman with constellations for pupils and a large…
    img: null
    description: >-
      <p>A woman with constellations for pupils and a large sack trudges towards a smoldering chunk of dead
      star in the distance. In a past age the Archons shattered the Astrologer's star to thwart her ascension,
      but she is determined to stitch it back together. Every recovered piece adds to her sack's astronomical
      weight, making it harder to fend off the clawing demons.</p>
