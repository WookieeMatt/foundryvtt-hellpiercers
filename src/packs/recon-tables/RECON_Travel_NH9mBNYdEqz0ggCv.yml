  - _id: hlH1ReCP9NXrLVp4
    type: text
    name: Beams of light emerge sourcelessly from the ground, weaving…
    img: null
    description: >-
      <p>Beams of light emerge sourcelessly from the ground, weaving between each and carving intricate
      fractals in their trails. Slag and glass and wet, stinking heat well up along the edges of the channels
      the lights carve. As their work is almost complete, it becomes clear that their labor was the carving of
      a summoning circle. Its runes are carved in the language of the lost Martian philosophers. A being is to
      be born here, in mere moments, from the time of one of humanity’s failed ascensions to godhood.</p>
    weight: 1
