    img: null
    description: >-
      <p>A sprawling refinery sits precariously on a floating island in the middle of a gaping chasm.
      Fulfilled, dead, and half-true prophecies have every last shred of rarefied augury squeezed out of them
      here. Once extracted, it is processed into a dangerous psychedelic which gives demons insight into the
      immediate future.</p>
