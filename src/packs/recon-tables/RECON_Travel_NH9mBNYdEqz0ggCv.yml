    type: text
    name: On the horizon, the shattered remains of a dwarf…
    img: null
    description: >-
      <p>On the horizon, the shattered remains of a dwarf planet lie half-buried in the ground, like a
      corroding shipwreck on the ocean floor. This is Phaeton, a planet once said to have lain between Mars
      and Jupiter, pulled here by a failed experiment. The demons shun this stolen world, for Phaeton never
      existed and should not be here. And yet, lights dot its distant peak.</p>
