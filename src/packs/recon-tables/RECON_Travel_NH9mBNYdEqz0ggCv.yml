    type: text
    name: You stumble upon the unattended ruins of what was…
    img: null
    description: >-
      <p>You stumble upon the unattended ruins of what was once Hell’s great glass manufactory. Workstations
      were abandoned in a rush. Tools scatter the floor. Shattered glass and unrefined sand crunch beneath
      your feet. Beautiful phantoms of creations that might have been</p><p>haunt the entire space. A thumping
      sound emerges from the central furnace. Some gargantuan creature lies in agony, half-fed into the base
      of the furnace. It bellows and thrashes in the blind pain of centuries pinned in the machinery.</p>
