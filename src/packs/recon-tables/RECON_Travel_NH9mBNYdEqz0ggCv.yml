    name: Nearby stones, loose ropes, chains, and jewelry begin to…
    img: null
    description: >-
      <p>Nearby stones, loose ropes, chains, and jewelry begin to float into the air. As you realize what is
      taking place, your feet have already become so light you are no longer tethered to the ground. Your
      entire convoy has unwillingly taken to the sky. The ground below you is seemingly no more. An enormous,
      black shadow passes over you all. You have entered the hunting grounds of the Bythic Kite.</p>
