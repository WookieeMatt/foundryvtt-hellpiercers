    name: What had appeared to be the silhouette of two…
    img: null
    description: >-
      <p>What had appeared to be the silhouette of two linked towers turns out to be the body of an enormous
      firearm driven into the earth of Hell. No trigger or other operating mechanisms are visible. Spherical
      indentations lined with textured glass dot the surface of the gun. Closer inspection reveals these to be
      biometric sensors. This weapon could only be operated by a cephalopod of colossal size.</p>
