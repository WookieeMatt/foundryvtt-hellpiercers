  - _id: 0Wi6bFdgE1NxZQIG
    type: text
    name: A storm in Hell isn’t just rain and wind.…
    img: null
    description: >-
      <p>A storm in Hell isn’t just rain and wind. It's made of the same stuff everything else is: dead
      people. Souls whip themselves into hurricanes and thrash in the thousands against the dirt. They bellow
      into the air and launch themselves at the sky in a desperate rage. They lash with teeth of red thunder
      and crush with strange pointed digits emerging from thick dark clouds. The ground is part of it, made of
      the same soulstuff—it roils like the ocean, swallows like the void. There is a storm coming.</p>
    weight: 1
    range:
