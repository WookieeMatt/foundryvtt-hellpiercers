    type: text
    name: You happen across a series of ramshackle huts and…
    img: null
    description: >-
      <p>You happen across a series of ramshackle huts and stalls. Demons devoid of affiliation roam about,
      chatting, plying trades and trading goods. Oathbreakers and The Fatherless and Self- Mothers chatter
      readily and happily here. Demonstrations of demonic meditative practice play out in a hastily cleared
      space. Pacts, contracts, and ad-hoc agreements are spoken, scrawled, and signed here. A sign, seemingly
      made by a flaming finger drawn across black steel, hangs above the entrance to this space. It reads “Lay
      down your arms, drink from our cup.”</p>
