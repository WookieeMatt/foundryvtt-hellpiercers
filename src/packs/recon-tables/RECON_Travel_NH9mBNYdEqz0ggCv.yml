  - _id: WHUjsCPV7BAxdrIY
    type: text
    name: The Graveyard of Blades stretches out for as far…
    img: null
    description: >-
      <p>The Graveyard of Blades stretches out for as far as your eye can see; this is the Hell of weapons,
      the place spears and bows went after the gun, the place the bullet went after humanity learned to throw
      stars at each other. Every weapon ever made rests here, along with the spirits of those who could not
      give them up.</p>
