  - _id: rQaBdw3brHKN09ry
    type: text
    name: Against the horizon two forms solidify. A titanic serpent…
    img: null
    description: >-
      <p>Against the horizon two forms solidify. A titanic serpent and auroch are locked in mortal conflict.
      The serpent sinks its fangs into the auroch, then swallows the creature whole. The auroch bursts forth
      from the belly of the serpent in a rain of demonic viscera. As the last piece of gore settles on the
      ground, it begins to flow back into the serpent’s wound, reinvigorating it. The creatures make to resume
      their battle, but then their eyes settle onto your convoy.</p>
    weight: 1
