  - _id: 6qic3XC8VF34Cwo3
    type: text
    name: A young girl approaches you from the road. Her…
    img: null
    description: >-
      <p>A young girl approaches you from the road. Her hands are cupped, holding pungent and rich soil. She
      gestures at you pleadingly, thrusting her cupped hands toward you before throwing the soil to the
      ground. She opens her mouth to speak out her request and in the place of words, more loamy earth spills
      forward. Soil has collected in a pile at her feet. Eyes panicked and pitiful, she gestures to you once
      again for help.</p>
