  - _id: FEjitAKvveEbkb7p
    type: text
    name: An enormous formation of crystal juts from the landscape…
    img: null
    description: >-
      <p>An enormous formation of crystal juts from the landscape like a kris. Mandalic paths of braided gold
      twist along its form. It pulses and hums with a prayer unbroken since the time of the Ophite Collective,
      before the fall of Babel. The serpent gnosis collecting inside, supplicated in prayer, has grown fat and
      ripe. That no one has shattered it and made off with its fruits is an almost impossible idea. Unless, of
      course, someone or something sits as its steward, turning away all who would shatter the crystalized
      prayer.</p>
