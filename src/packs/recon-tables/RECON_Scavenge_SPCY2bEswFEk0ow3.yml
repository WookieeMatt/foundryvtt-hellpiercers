    name: The party sights an abandoned tomb ruined by the…
    img: null
    description: >-
      <p>The party sights an abandoned tomb ruined by the constant howling winds. Within is a sentient shadow,
      a remnant of one of the lost factions. It is willing to trade up to three of the resources it holds
      within its body in exchange for accompanying the party to their destination. If they agree, select a
      miniboss from any faction and allow the party to control it as a shared unit. If the shadow encounters a
      boss creature, it will attempt to consume it and take its <strong>Crown</strong>. What happens next is
      up to you.</p>
