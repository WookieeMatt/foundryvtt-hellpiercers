  - _id: xf2s3xkfbLycNpLh
    type: text
    name: On a hellswept bluff, twin stone obelisks mark a…
    img: null
    description: >-
      <p>On a hellswept bluff, twin stone obelisks mark a set of stairs leading deep into the bowels of Hell.
      At the foot of the stairs rests a wide, open chamber, lit with an unearthly light. Its low ceiling is
      decorated in images of the divine feminine, while the center of the room is taken up by an enormous
      summoning circle bearing the sign of the ouroboros. If a player steps into this circle, they appear on
      the frontlines of a vast demonic horde. <strong>Have all players who stepped in the circle select a
      demonic faction, and a unit from that faction</strong>. They are experiencing a temporal vision of the
      pivotal moment when that faction rose to power, claiming their crown and their sovereignty. <strong>With
      some effort, players can leap between crea tures in this realm, with minions being easy to co-opt and
      bosses nigh impossible</strong>. During any <strong>TACCOM</strong> scenes, have players use enemy units
      and allow them to change to another enemy unit as a Support Action or when their current host dies.
      Players leave with their new insights when it is narratively dramatic for them to do so.</p>
    weight: 1
    range:
      - 10
      - 10
    drawn: false
