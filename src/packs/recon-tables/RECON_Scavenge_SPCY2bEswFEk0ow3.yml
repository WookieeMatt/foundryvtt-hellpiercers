  - _id: Eq11ueY341bblAlX
    type: text
    name: A rich source of fuel and supplies erupts from…
    img: null
    description: >-
      <p>A rich source of fuel and supplies erupts from a volcanic geyser nearby. Enemy faction units are
      attempting to exploit the same resources as the players here too. Create a <strong>TACCOM</strong> map
      with a large volcano in the center, occupying a roughly <strong>3x3 space</strong>. At the start of
      every round, select a tile at random by rolling one die for the row and one for the column. The volcano
      launches a <strong>1x1 fireball</strong> from the center of the volcano toward the random tile. It moves
      1 space at the end of each turn (player or GM) until it arrives at its destination. <strong>The fireball
      deals 6 damage to any unit it collides but otherwise does not impede movement</strong>. When the
      fireball arrives at its destination, it creates a <strong>Blast:2</strong>, <strong>5 damage</strong>
      explosion that converts all spaces within the blast to <strong>Scorch</strong> terrain.
      <strong>Scorch</strong> terrain deals <strong>1 damage</strong> when a unit leaves that space.
      <strong>To win, the players must interact with the Volcano three times</strong>. If an enemy faction
      <strong>Interacts</strong> with the <strong>Volcano</strong>, launch a fireball at one player
      character’s current location. When anyone Interacts with the <strong>Volcano</strong>, it gains
      <strong>Cooldown:1</strong>, preventing anyone else from <strong>Interacting</strong> with it until the
      next round.</p>
    weight: 1
    range:
      - 8
