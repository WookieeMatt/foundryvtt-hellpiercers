  - _id: UFcJibASNAKKF8dU
    type: text
    name: Fog rolls down a nearby embankment, wailing and carrying…
    img: null
    description: >-
      <p>Fog rolls down a nearby embankment, wailing and carrying dreaded reality edits, pulling apart the
      local timespace. Several enemy battalions are using it as cover. While the player squad’s extractor
      runs, create a <strong>TACCOM</strong> map with a defensible location on one side, the
      <strong>Base</strong>, where the players spawn. The rest of the map is a flat open space. <strong>Draw a
      line across the map around two rows ahead of the base</strong>. Players may not pass this line. At the
      end of each round, the fog covers the furthest uncovered row from the Base, advancing toward the line
      drawn earlier. When the fog reaches that line, the extractor finishes its work. <strong>Players cannot
      see through the fog, cannot use any abilities that reveal enemies under the fog, etc</strong>. The GM
      may spawn units as they see fit, most likely a minion heavy mix from the current faction.</p>
    weight: 1
