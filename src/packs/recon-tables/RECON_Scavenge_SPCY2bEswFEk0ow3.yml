  - _id: F4QAmF4WTBQz1vBa
    type: text
    name: A network of chasms and canyons blocks lines of…
    img: null
    description: >-
      <p>A network of chasms and canyons blocks lines of sight and egress. The survey auguries have detected
      veins of hardened soulmatter within. Deeper into the labyrinthian geography, the walls of nousbound
      stone grow pliant, malleable, soft like melting plastic. After the players find the source of the
      readings and begin extraction, alien claws grasp from within the gloopy rock. Demons from factions not
      actively in play tear their way into this reality. Create a <strong>TACCOM</strong> scene with lots of
      long corridors branching off from a large central arena. These corridors terminate in an
      <strong>Escape</strong> tile that allows players to leave the battle when interacted with. <strong>Pick
      4 or 5 spawners</strong> from a variety of factions and place them within the walls of the canyon. Spawn
      units out of the boundaries of the map and the walls.</p>
    weight: 1
