  - _id: 4t3xi1qtz3cmXWmF
    type: text
    name: Within the pile of scrap is a much larger…
    img: null
    description: >-
      <p>Within the pile of scrap is a much larger construct, buried by centuries of dust/soil/rock/living
      fungus. It’s human, but it’s not one of yours. Within are a number of corpses in NASAstyle space suits,
      too decomposed to identify. Its fragmented logs describe something called <strong>THE SAMSON
      PROTOCOL</strong>, an undocumented incursion into Hell for unknown purposes. It looks like whoever these
      humans were, they failed. Create a <strong>TACCOM</strong> map with a wide open space, centered on a
      large wreck. The wreck has at least one <strong>Interact</strong> space marked, and one “wall” of the
      arena should be marked as the point of egress, but the map is otherwise empty until the wreck has been
      Interacted with by a player. As soon as the players interact with the wreck, <strong>spawn a massive
      horde of at least 10 units on an edge of the bat tlefield</strong>. Spawn another at the start of the
      next round, and another at the start of the round following. If players defeat the entire horde, they
      secure the wreck for transport back to DIS, where someone will help figure out what was going on here.
      Otherwise, they may escape via the egress tiles.</p>
