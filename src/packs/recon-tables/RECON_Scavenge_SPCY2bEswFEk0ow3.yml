  - _id: NIoqOtknfimIhf4G
    type: text
    name: Resources here require the deployment of an ascension-blessed spinther…
    img: null
    description: >-
      <p>Resources here require the deployment of an ascension-blessed spinther ignition drill. Create a
      <strong>TACCOM</strong> map large enough to accommodate <strong>three small hills with an Interact spot
      at the top of each</strong>. When a player interacts with those spots, they place the
      <strong>Drill</strong> and begin converting the soil into liberated ascended humanity, creating an
      enormous golden veil of godsmoke. The drill gains <strong>Countdown:8</strong>, remove each drill that
      reaches 0. After the first hill is interacted with, begin spawning one <strong>Minion</strong> unit near
      the edge of the battlefield after each player turn and one <strong>miniboss</strong> at the end of each
      round. Each additional <strong>Drill</strong> placed spawns<strong> one additional minion per player
      turn and one additional Miniboss per round</strong>. If players activate all three drills, spawn one
      <strong>Boss-level creature at the end of the following round instead of three Minibosses</strong>. At
      the end of each drill’s countdown, players receive <strong>4 Hellsteel</strong>, <strong>4
      Brimstone</strong>, or <strong>4 Soulfire</strong>, and may opt to leave the battle immediately. If they
      complete all three drills, end <strong>TACCOM</strong> and roll on the <strong>Vaults</strong>
      table.</p>
    weight: 1
