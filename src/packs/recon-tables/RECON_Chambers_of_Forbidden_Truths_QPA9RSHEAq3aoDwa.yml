  - _id: jqbqvEFs7AybK4Hy
    type: text
    name: A mundane and empty chamber folds away, its walls…
    img: null
    description: >-
      <p>A mundane and empty chamber folds away, its walls shifting and vanishing like an impossible origami
      sculpture. The bright light of an alien world and the heat of its bioluminescent surface sear strange
      implications and half-grasped truths into the players minds. TACCOM takes place in a narrow
      corridor,<strong> no more than 4 or 5 squares wide</strong>. After 3<strong> turns of com bat</strong>,
      this corridor rises and begins to move forward. The players find themselves standing on the back or limb
      of a titanic beast. Create an <strong>Interactable</strong> space at the top of the corridor that allows
      the players to shunt the beast 2 squares left or right. Any attack with <strong>Push:2</strong> or more
      will also move the beast a single space in the relevant direction. Other beasts maneuver beside,
      infront, or behind the player's mount, made up of whatever shapes or terrain effects the GM feels
      appropriate. Each contains a medium size <strong>Swarm</strong>, <strong>two minibosses</strong>, or a
      <strong>fac tion Boss</strong>. As the beast moves, it may move through pockets of
      <strong>Hazard</strong> terrain, which deal inflict either <strong>Slow:2</strong>,
      <strong>Bleed:2</strong>, or <strong>Poison:2</strong> to anyone caught in them.</p>
    weight: 1
    range:
      - 18
      - 18
    drawn: false
    flags: {}
