  - _id: KKSmS22tUlSV3qa5
    type: text
    name: The once-proud throne room of Iaos, Archon of Time.…
    img: null
    description: >-
      <p>The once-proud throne room of Iaos, Archon of Time. His shattered sun disc hangs low from the
      engraved ceiling. Four shards of it embedded in the floor shine a strange green-gold hue. These Shards
      are <strong>Obstacle:10</strong> objects that cause massive instabilities when broken, converting a
      <strong>Burst:2</strong> area centered around them into Void tiles. Here, time has become completely
      unmoored. Instead of standard <strong>Initiative</strong>, the GM begins each round by declaring what
      actions each of their units will take, players then take all their actions, before the GM plays out
      their predetermined moves in whatever order they desire. For each broken shard, the GM may <strong>spawn
      one miniboss-level unit from any active faction</strong> that takes its turn without this restriction,
      acting at the end of the round.</p>
    weight: 1
    range:
      - 17
      - 17
    drawn: false
    flags: {}
