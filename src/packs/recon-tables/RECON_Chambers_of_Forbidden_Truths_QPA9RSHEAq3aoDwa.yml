    type: text
    name: In the center of a very large room is…
    img: null
    description: >-
      <p>In the center of a very large room is a single <strong>Void</strong> tile with the Attractor effect
      over an infinite range. Once per turn, it emits an <strong>Arc:6</strong> attack dealing<strong> 3
      damage</strong> to any unit it touches, inflicting either <strong>Slow:2</strong>,
      <strong>Shaded:2</strong>, <strong>Healing:3</strong>, or <strong>Haste:1</strong> (roll a D4 to
      determine which). If this attack kills a minion, that minion is converted to a <strong>Void</strong>
      tile with the <strong>Attractor</strong> effect over <strong>Range:2</strong>. The void tile in the
      center has all the traits of any Spawner tagged unit from any active enemy faction.</p>
