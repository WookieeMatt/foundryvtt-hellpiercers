    type: text
    name: Effigies of Beelzebub line the sunken, furrowed walls of…
    img: null
    description: >-
      <p>Effigies of Beelzebub line the sunken, furrowed walls of this arena. <strong>Enemies in this area do
      not have HP. To defeat them, they must collide with a wall.</strong> At the GM’s discretion, assign the
      following two effects to two minibosses in the current conflict, triggering when that miniboss is
      defeated:</p><p><em>Place a D20 on the table turned to 1. At the end of every round, increase it by 1.
      Add the value of the D20 to all damage dealt to all parties in this conflict. Reduce the die by 1 if a
      creature enters AGNOSIA</em></p><p><em>Each side places one Tower within Range:2 of their units, first
      the GM, then the Players. Both towers gain Countdown:4. Flip a coin, and assign one tower the result,
      and the other tower the opposite result. When Countdown hits zero, the Heads Tower heals 6 HP to all
      adjacent creatures, and grants any extra Healing as Temporary HP. The Tails Tower deals 6 damage to all
      adjacent creatures and inflicts either Poison:2 or Bleed:1. The towers swap their function at the end of
      this round and reset their Countdown.</em></p>
    weight: 1
