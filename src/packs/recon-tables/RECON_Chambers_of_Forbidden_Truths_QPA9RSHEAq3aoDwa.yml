  - _id: ueYeOH3ghKbvvoOT
    type: text
    name: The hylic-emulation here is unstable, loosened by a trillion…
    img: null
    description: >-
      <p>The hylic-emulation here is unstable, loosened by a trillion subjective years of history pressing
      down at the edges. <strong>Get a 52-card poker deck, shuffle it, and make a deck with 10 cards drawn
      from the top.</strong> Begin TACCOM in a large room with 3 corridors, each leading off into a Fog Of War
      shadow. When players move down a corridor and enter a new room, draw a card. Reshuffle the deck and
      repeat the process whenever the players pass through an unexplored door. Rooms share their contents with
      every other room represented by that card—if you draw a Queen Of Diamonds card three times in a row,
      each room will be the same as the last. Enemies, objectives, and so on all remain the same as when the
      players left that room last.</p>
