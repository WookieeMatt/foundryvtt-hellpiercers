    description: >-
      <p>The chamber is in utter chaos already. Spectral psi-space imprints of a thousand battles rage before
      the players. In addition to <strong>a medium sized Swarm</strong> and one<strong> Faction Boss</strong>,
      create three <strong>Blob:4</strong> clouds of ghostly mist around a large open area. Once per turn,
      spawn a unit from each <strong>Blob</strong> and reduce the <strong>Blob</strong> by that unit’s Scale.
      In this chamber, attacks gain the <strong>Delayed trait, their patterns only applying at the start of
      the attackers next turn</strong>. Attacks can harm allies caught in them.</p>
