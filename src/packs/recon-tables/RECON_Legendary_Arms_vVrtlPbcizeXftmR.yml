    type: text
    name: Delicate Suffering
    img: null
    description: >-
      <h3>Delicate Suffering</h3><p><em>One of the 8 legendary arms held in the Beelzebuthian Armory.
      ASTANPHAEUS’s most subtle work. By its gossamer edge was the golden skin of man flayed, our original
      divinity removed in tattered strips and used to sew the material fetters that bound us. Its cuts inflict
      no pain, some thing the Archon himself discovered shortly before his death.</em></p><p><em>All targets
      hit with this weapon gain the Glassflesh
      status:</em></p><p><em><strong>Glassflesh</strong></em></p><p><em>Target receives double damage from the
      next attack targeting them. The affected unit retains the Glassflesh status until they die, but take no
      additional damage on attacks after the first. When defeated, the enemy unit leaves the status behind on
      the space they died. Any enemy unit who en ters this space removes the effect from the terrain and gains
      the Glassflesh status. This effect can stack if the enemy unit picks up additional Glassflesh
      statuses.</em></p><p><strong>Range:4, Target:3</strong></p><p><strong>Extinguish: 3</strong></p>
