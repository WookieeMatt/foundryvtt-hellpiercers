    name: Allegiance Of The Keraunios-Sky
    img: null
    description: >-
      <h3>Allegiance Of The Keraunios-Sky</h3><p><em>One of the 8 legendary arms held in the Beelzebuthian
      Armory. Everything in Hell is sentient. The dust is made of the scattered ashes of a billion souls, the
      dirt is the compacted minds of an eternity of torture. Even fleeting lightning, for a microsecond, is a
      complete being. Sentience begs intelli gence, intelligence begs need, and need begs negotiation,
      alliances, and collaboration.</em></p><p><em>Each enemy targeted by this attack creates a Burst:1
      explosion, dealing damage equal to the initial attack to all enemies within. Any enemy that dies from
      this attack creates an additional Arc:2 at tack pattern that follows the same rules.
      </em></p><p><strong>Arc:4, Damage:5</strong></p><p><strong>Extinguish: 4</strong></p>
