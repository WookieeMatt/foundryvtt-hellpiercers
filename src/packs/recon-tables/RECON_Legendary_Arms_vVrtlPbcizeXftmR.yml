  - _id: IJGvtevPoUrB7DU0
    type: text
    name: Militarized Auto-Styxiation Suite
    img: null
    description: >-
      <h3>Militarized Auto-Styxiation Suite</h3><p><em>One of the 8 legendary arms held in the Beelzebuthian
      Armory. The nature of Hell necessitated a unique approach to punishment; a sort of second hell,
      imprinted deep on the synth-spinther, emits an aura of misery around the subject, forcing them into a
      waking, walking prison of scorn.</em></p><p><em>Attack: Select two enemies within Range:6 and attach a
      Ring:1 pattern to each unit. The pattern has the following effects</em></p><h3>Ring of
      Suffering</h3><p><em>The ring deals <strong> 5 damage</strong> to any units who begin their turn within
      it. The ring also deals <strong>5 dam-</strong> <strong>age</strong> to any unit who ends their turn
      within it. All units who begin their turn, pass through, or end their turn within the ring suffer
      <strong>Slow:2</strong> , <strong>Bleed:2</strong> . Any unit with a <strong>Ring of Suffering</strong>
      that dies passes along the ring to any enemy within the ring at the time of death. If multiple enemies
      are within the ring, the HELLPIERCER who landed the final blow selects one. </em></p><p><em>If two Rings
      of Suffering overlap, both affected units immediately explode in a <strong>Blast:2</strong> pattern that
      deals <strong>10 damage</strong> to all enemies in range.</em></p><p><strong>Range:6,
      Targets:2</strong></p><p><strong>Extinguish: 2</strong></p>
