    description: >-
      <h3>Inversion-Infused Chained Ascension Missile Launcher</h3><p><em>One of the 8 legendary arms held in
      the Beelzebuthian Armory. Forcibly injects 98% purity as cended mindforms into the target’s
      spinther-cage, causing an immediate and violent chain reac tion of escalating awakenings; each using the
      gnosis of the last to fuel the ascension of the next. </em></p><p><em>Deal 3 damage to all enemies in
      <strong>Burst:6</strong> around the targeted unit. Before assigning damage, all targets within
      <strong>Burst:6</strong> gain <strong>Nova Burst:2.</strong></em></p><p><em><strong>Nova Burst</strong>
      : When this unit dies, they explode, dealing x damage in <strong>Burst:3</strong> , where x is equal to
      3 per every unit with <strong>Nova Burst</strong> killed this encounter. Any unit caught in this area of
      effect gains <strong>Nova Burst:2</strong> before taking damage. </em></p><p><strong>1 Target,
      Range:6</strong></p><p><strong>Extinguish: 3</strong></p>
