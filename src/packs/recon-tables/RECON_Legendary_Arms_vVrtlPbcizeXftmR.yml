    name: Thanatotic Refining Alchemic Cannon
    img: null
    description: >-
      <h3>Thanatotic Refining Alchemic Cannon</h3><p><em>One of the 8 legendary arms held in the Beelzebuthian
      Armory. In scavenging the libraries of the Archons techniques meant for punishing upstart humanity were
      discovered. Physicalization of the pain of loss was quickly discarded as it resulted uniformly in
      instant death. For HELLPIERCERS who sought not torture, but the elimination of their opposition this
      quirk was eminently weaponizable.</em></p><p><em>The unit at the center of the attack pattern has damage
      dealt to them last. If this attack kills any units not in the center of the attack pattern, this attack
      deals 100 damage to the unit at the center when damage is dealt.</em></p><p><strong>Damage:
      1D6</strong></p><p><strong>Exhaust: 3</strong></p>
