    name: Essence Of Baal’s Final Bastion
    img: null
    description: >-
      <h3>Essence Of Baal’s Final Bastion</h3><p><em>One of the 8 legendary arms held in the Beelzebuthian
      Armory. Though no ruins have been lo cated, Baal’s fortress is legendary among Hellions; their own
      attempt at heavenly invasion, a leviathan of flesh, bone, and hellsteel clawing at the oilslick sky. A
      fragment of its soul thrashes in this vial.</em></p><p><em>Create an impenetrable dome in a Blast:1
      pattern. The dome has Countdown:3, and dissipates af ter the status is resolved. Units cannot move in or
      out of the dome, cannot be targeted by any at tacks, and cannot be inflicted with any status effects.
      Terrain tiles within the dome are im mutable, and not affected by any abilities or effects that would
      change them. The dome can be tar geted, and the effects of the attack are applied to all units caught
      within it.</em></p><p><strong>Range:6, Blast:1</strong></p><p><strong>Extinguish: 3</strong></p>
