name: Draw Bounding Box
type: script
_id: FYdoxdvNrKFBrFk5
author: JIYn39iJgV1tMnlB
img: icons/svg/temple.svg
scope: global
command: |-
  const aabb = new PIXI.Rectangle(
    100,
    100,
    200,
    200,
  );

  if (!this.drawing) {
    this.drawing = new PIXI.Graphics();
    canvas.stage.addChild(this.drawing);
  }
  this.drawing.clear();
  this.drawing.lineStyle({
    color: 0x00ff00,
    thickness: 2,
  });
  this.drawing.drawShape(aabb);
