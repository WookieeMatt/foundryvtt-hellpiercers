name: SVG and Template Test
type: script
command: |-
  const range = await hellpiercers.applications.RangeEditor.editRange({
    kind: "line",
    value: 2,
    modifiers: { scale: actor?.system.scale },
  }).catch(() => {});

  if (!range) return;

  const { Dialog } = foundry.applications.api;
  await Dialog.prompt({ content: `<img src="${range.svg_uri}">` });

  (() => hellpiercers.util.placeTemplate(range, { actor }))();
