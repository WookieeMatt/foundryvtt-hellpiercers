    image: {}
    text:
      format: 1
      content: >-
        <p>This system is still in the alpha phase. Not all features are
        implemented.</p><p>Notable missing features:</p><ol><li><p>STRATCOM base
        building and unlocks.</p></li><li><p>Recon</p></li></ol><p>Your patience
        is appreciated.</p><h2>Reporting Issues</h2><p>Open issues can be seen
        here: <a
        href="https://todo.sr.ht/~bolts/foundryvtt-hellpiercers">https://todo.sr.ht/~bolts/foundryvtt-hellpiercers</a></p><p>Bug
        reports can be submitted to the ticket system via email at the page
        above.</p><h1>Be aware that until the system hits 1.0, breaking changes
        may occur on updates.</h1><p>I will try to warn in advance in the
        patchnotes on the repository, but I'm only human.</p>
