  - sort: 400000
    name: TACCOM
    type: text
    _id: 6aOhXXkmva1ymTM7
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><strong>Turns.</strong> Players act in any order, then the GM activates each enemy. Click a combatant in the
        tracker to start its turn. Bosses use the Variable Action System: the Actions stat is
        <code>actions/players</code>, so <code>1/2</code> is one action for every two players, rounded down, minimum 1.
        The boss sheet shows the result and a button to recalculate it when players join or
        leave.</p><p><strong>Actions.</strong> Each unit has Main, Support, Aux and Move pips. Spending a spent action
        uses a stack of Haste. Shock makes every action count one tier higher, Frozen blocks Aux and Pin blocks
        Move.</p><p><strong>Turn effects.</strong> At the start and end of a turn the system resolves Poison, Healing,
        Blazing (and its spread), Pain Aura, Countdown, Brand and the Spawner's charge, then decays Effects. Each result
        is posted to chat. <em>Automate Turn Effects</em> switches this off.</p><p><strong>Attacks.</strong> Click the
        dice icon on a weapon, strike or boss attack. The attack dialog shows the damage and range; area attacks have a
        range button that places a template and targets everything inside it. Confirm and the system rolls and posts one
        damage card per target. A button on each card applies the damage with Armor, Bleed, Broken, Wrack, Snakeskin,
        Glassflesh, Compel and Constrict taken into account, plus Transference and Bound on the attacker and Temporary
        HP on the target.</p><p><strong>Effects.</strong> Chips under the name show each Effect and its stacks; click to
        add or remove a stack, or use the plus chip to add a new one. A unit at 0 HP is defeated and offers a Rez button
        (Main Action).</p><p><strong>Provoke.</strong> When a token is dragged away from an adjacent enemy the GM client
        rolls the 1D6 Provoke attack, per enemy unit and along the whole path. Flying (Aegis) units, forced movement and
        anything flagged <code>hellpiercers.noProvoke</code> are exempt; MURIEL ignores enemies she moved through this
        turn; KOPIS's Offhand Pistol fires back automatically. Every Provoke card has an <strong>Undo</strong> button
        for the GM, for terrain exemptions such as JEHOEL's or any table ruling. <em>Expanded Aggression Rituals</em>
        applies Aggression, which makes the user Provoke out to Range:2.</p><p><strong>Swarms.</strong> The token HUD
        has a Swarm palette: <strong>New Swarm</strong>, <strong>Join adjacent</strong> (units of the same type that
        touch), <strong>Merge selected</strong> and <strong>Delete</strong>. A Swarm has 10 HP per tile and breaks into
        smaller Swarms when tiles stop touching. When a Swarm attacks, the dialog makes one attack per adjacent tile (at
        most 4 against Scale 1, 12 against Scale 2), each with +1 damage per adjacent tile, then asks which tiles to
        expend.</p><p><strong>Limit Breaks, AGNOSIA and Reversal.</strong> Every enemy a HELLPIERCER defeats adds to
        their Limit Break (each Swarm tile counts). Bosses and Minibosses announce their AGNOSIA once, when they first
        reach the threshold. Reversal charges and Equipment uses are spent when the ability is used.</p>
    video:
      controls: true
      volume: 0.5
    src: null
    ownership:
      default: -1
