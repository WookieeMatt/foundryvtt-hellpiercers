  - sort: 1100000
    name: Troubleshooting
    type: text
    _id: dGDqveNr0ClZOSnZ
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <ul><li><strong>A compendium is missing or empty.</strong> After updating the system, restart Foundry or reload
        the world so the packs are re-read.</li><li><strong>No animations.</strong> Check that Sequencer and a JB2A
        library (or Automated Animations) are enabled in the world, and that <em>Animations</em> is not set to none. The
        provider and the JB2A library in use are shown by
        <code>hellpiercers.animations.describe()</code>.</li><li><strong>Provoke does not trigger.</strong> It needs a
        started combat on a square grid, a manual move (drag, keyboard or HUD) and the <em>Automate Provoke</em>
        setting.</li><li><strong>Sheets look unstyled.</strong> Hard-refresh the page (Ctrl+F5) after updating; make
        sure the world runs Foundry v14.370.</li></ul>
    video:
      controls: true
      volume: 0.5
