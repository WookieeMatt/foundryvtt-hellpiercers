  - sort: 100000
    name: Welcome
    type: text
    _id: sc25ZAOrEltKH3uL
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>HELLPIERCERS for Foundry VTT automates the three layers of the tabletop game for <strong>Foundry
        v14.370</strong>:</p><ul><li><strong>TACCOM</strong>, the grid combat: turn order, action tracking, damage,
        Effects, Provoke, Swarms, Limit Breaks and AGNOSIA.</li><li><strong>STRATCOM</strong>, the campaign: the
        division's base and tech tree, missions and rewards, the GM's factions, convoys, research, map hazards and
        Ichor.</li><li><strong>RECON</strong>, exploration: 2D6 + tags rolls, the Tone Die and every roll table in the
        Core Rules.</li></ul><p>Everything is optional. The system never takes a decision away from the table:
        automation can be switched off in the settings, and every automatic result is posted to chat so it can be
        corrected.</p><p>The system is a private fan tool and contains no official art. HELLPIERCERS is by Sandy Pug
        Games.</p>
