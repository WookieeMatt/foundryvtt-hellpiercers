  - sort: 900000
    name: Modules and Settings
    type: text
    _id: pPhKOMuVN3FqDdRv
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><strong>Dice So Nice.</strong> With <em>Themed Dice</em> on, damage, healing, RECON, the Tone Die, Provoke
        and each faction's Quality dice roll in their own colours.</p><p><strong>Animations.</strong>
        <em>Animations</em> picks the provider: <em>Automatic</em> tries Automated Animations first and falls back to
        the built-in effects; the other choices use one provider or none. Automated Animations matches on the attack's
        name, or on rules you write named <code>HELLPIERCERS Melee</code>, <code>HELLPIERCERS Ranged</code>,
        <code>HELLPIERCERS Burst Fire</code> and so on. The built-in effects need Sequencer and a JB2A library. The
        system detects whether the <strong>Free</strong> or the <strong>Premium (Patreon)</strong> library is active,
        uses Premium when both are, and every effect falls back to the best animation the installed library has.
        <em>JB2A Library</em> can force Free.</p><p><strong>Sheet Theme.</strong> <em>Parchment</em> is the book's
        pages; <em>Night</em> is the cover's slate and violet. It is a per-user
        setting.</p><table><thead><tr><th>Setting</th><th>What it does</th></tr></thead><tbody><tr><td>Player Count
        Override</td><td>Number of players for boss actions; blank detects them</td></tr><tr><td>Automate Turn
        Effects</td><td>The GM client resolves turn effects and decay</td></tr><tr><td>Armor / Bleed Stack
        Rule</td><td>Flat as written, or per stack</td></tr><tr><td>Track Actions</td><td>Action pips in the combat
        tracker</td></tr><tr><td>Post Ability Cards</td><td>Using an ability posts a card and spends its
        action</td></tr><tr><td>Automate Provoke</td><td>Roll Provoke when a token leaves an
        enemy</td></tr><tr><td>Active Party</td><td>The Party whose buildings unlock items</td></tr><tr><td>Unlocks From
        Party Buildings</td><td>Derive unlocks from the Party</td></tr><tr><td>Sheet Theme</td><td>Parchment or Night,
        per user</td></tr><tr><td>Themed Dice</td><td>Dice So Nice colours</td></tr><tr><td>Animations, JB2A Library,
        Animate Attacks, Animate Effects</td><td>Animation provider and what is animated</td></tr></tbody></table>
    video:
      controls: true
      volume: 0.5
    src: null
