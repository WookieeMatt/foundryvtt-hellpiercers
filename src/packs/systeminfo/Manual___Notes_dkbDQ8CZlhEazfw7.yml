  - sort: 1200000
    name: Change Log
    type: text
    _id: D27PLHuAiR2jbP4q
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>0.8.0</h2><ul><li>Night theme audited on every sheet, tab, dialog, chat card and journal; contrast
        checked.</li><li>Rules Reference and Manual journals styled like the book: ribbon headings, inked tables, a
        black page list.</li><li>Dialogs (including the ones sheets open) wear the same look as the sheets.</li><li>The
        Manual &amp; Notes journal rewritten for the current system; generated from
        <code>docs/GUIDE.md</code>.</li><li>New documentation: user guide, theming guide, this changelog.</li><li>Fixed
        a stray character in the faction Actions tab and a heading that wrapped its
        button.</li></ul><h2>0.7.0</h2><ul><li>The book's look: aged parchment, thick black ink, gold ribbon labels,
        crimson paint edge, blackletter titles.</li><li>Two palettes with a per-user Sheet Theme setting: Parchment and
        Night.</li><li>Restyled every actor and item sheet, chat card, the attack dialog, action pips, status chips and
        the combat tracker.</li><li>Bundled Big Shoulders, EB Garamond and Pirata One (SIL OFL).</li><li>STRATCOM sheets
        and system messages localized.</li></ul><h2>0.6.0</h2><ul><li>Dice So Nice: themed dice for damage, healing,
        RECON, the Tone Die, Provoke and every faction.</li><li>Animations: Automated Animations bridge plus built-in
        Sequencer effects using JB2A Free or Premium, detected automatically.</li><li>Faction STRATCOM actions for every
        faction, staged map hazards (Devolve, Eyerot) and Create Map Hazard.</li><li>Boss Variable Action System:
        actions per players, rounded in the players' favour, with a recalculate button.</li><li>Minibosses' extra
        attacks as items, with damage and range read from the book.</li></ul><h2>0.5.0</h2><ul><li>Faction Units
        compendium: 95 bosses, minibosses, minions, spawners and fortifications.</li><li>RECON Tables compendium: every
        roll table in the Core Rules, the NPC and Location generators and the Item D66.</li><li>Rules Reference journal
        built from the same catalogs the engine uses.</li><li>Swarms: join adjacent units, merge Swarms, expend tiles
        after an attack.</li><li>Provoke: Aggression and Range:2, MURIEL's pass-through, an Undo button on every Provoke
        card.</li></ul><h2>0.4.0</h2><ul><li>Limit Break credit from kills, AGNOSIA for bosses and Minibosses, Provoke,
        the Swarm attack plan.</li><li>Role actions and Triumph effects, the campaign map
        helper.</li></ul><h2>0.3.0</h2><ul><li>STRATCOM: the Party (resources, tech tree, item unlocks, missions,
        vehicle, Roles, Class Mastery, Legendary Arms) and the Faction (Crown, Qualities, locations, convoys, research,
        upgrades, War Journal).</li><li>Ichor and the STRATCOM phase, faction rolls, 17
        macros.</li></ul><h2>0.2.0</h2><ul><li>TACCOM: the turn engine, action economy, damage engine, ability cards,
        Effects with stacks and the scripting API.</li></ul><h2>0.1.0</h2><ul><li>Upgrade of the community HELLPIERCERS
        system to Foundry v14.370, kept as a separate private build.</li></ul>
