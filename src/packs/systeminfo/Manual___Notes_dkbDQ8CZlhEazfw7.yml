  - sort: 600000
    name: RECON
    type: text
    _id: 5BKCrH5s3w3FSL3e
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <ul><li><strong>RECON Roll</strong> (macro): 2D6 plus one for each relevant Tag. 7 or less fails, 8 to 9
        succeeds with a major drawback, 10 or more succeeds beyond expectations.</li><li><strong>Tone Die</strong>
        (macro): a D10 for how heated a scene is. 1 is de-escalated, 10 is TACCOM.</li><li>The <strong>RECON
        Tables</strong> compendium holds every table in the Core Rules as a RollTable: Chambers of Forbidden Truths,
        Corridors, Vaults, Legendary Arms, Scavenge, Scout, Travel, the NPC generator (Name, Traits, Desires), the Item
        Table (a D66) and the Location Generator (six columns).</li></ul>
    video:
