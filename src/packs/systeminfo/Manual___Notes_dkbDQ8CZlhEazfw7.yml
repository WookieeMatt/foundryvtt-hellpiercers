  - sort: 150000
    name: Change Log
    type: text
    _id: MauFU7m4EmDZ7Frx
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Beta 1 (0.beta1)</h2><ol><li><p>Add compendium of player build
        options and compendium of class and armor
        abilities.</p></li><li><p>Overhaul of sheets. All sheets are now
        toggled. By default sheets open in locked mod which limits the ability
        to edit their stats and items. Unlocking the sheet using the switch in
        the header bar allows adding deleting and moving items, editing stats
        (where they aren't derived), and generally setting up the actor. Putting
        it in locked/play mode prevents unintended edits. When creating a new
        actor or item, the sheet will open in edit mode
        automatically.</p></li><li><p>Add a configuration menu to HELLPIERCER
        and HALO sheets to enable unlocks.</p></li><li><p>Add automation for
        status decay and augment the Active Effect sheet with the system
        duration handling.</p></li><li><p>Add profile switching to HELLPIERCER
        and HALO weapons.</p></li><li><p>Add Equipment item type and
        sheet</p></li><li><p>Improve combat tracker styling</p></li><li><p>Add
        spawner actor type and sheets.</p></li></ol><p><span class="notification
        warning">Due to data changes to HALO Weapons, you may need to redo the
        damage and range for any existing weapons.</span></p><h2>Alpha 4
        (0.alpha4)</h2><p>Hotfix for alpha 3</p><ol><li><p>Fix an issue in
        datamodels that was causing attack data to be cleared when editing
        weapons.</p></li><li><p>Partial rework of the attack dialog. Improves
        attack dialog styling and appearance. Fixes positioning when changing
        the sidebar collapse state. Add opening animation. Reworks the dialog as
        a ui hud element. <br /><span class="notification info">Existing macros
        for attacks need to be recreated to account for these
        changes.</span></p></li><li><p>Add descriptions to status effects and
        re-sort the effects in the token hud to be alphabetically sorted in
        accordance with the core rulebook.</p></li></ol><h2>Alpha 3
        (0.alpha3)</h2><ol><li><p>Added swarm functionality. Minion units that
        are in combat can be group selected and added to a swarm if they have
        the Horde tag and are backed by the same actor by right clicking and
        selecting the New swarm option from the token hud.</p></li><li><p>Combat
        tracker is now built in. You should disable Lancer Initiative if you
        still have it. Multiple activations isn't handled yet and the styling
        isn't great, but it exists.</p></li><li><p>Revamped damage rolling and
        application. Should now be much closer to the rules, especially with
        respect to swarms. The chat cards are improved and now handle multiple
        targets with a single card.</p></li><li><p>New actors now have better
        defaults for disposition and actor link. These settings can still be
        overridden by prototype token overrides, but now HELLPIERCER and HALO
        actors are friendly by default and Minions have unlinked tokens by
        default.</p></li><li><p>Token sizing is now automatic. There's a toggle
        in the token config if you need to override without changing scale,
        otherwise token size will follow the scale stat (with live updates
        even)</p></li><li><p>A lot of under the hood stuff that doesn't really
        need description here, but rest assured, it makes <em>my</em> life
        easier.</p></li></ol><h2>Alpha 2 (0.alpha2)</h2><ol><li><p>Add HALO
        units and item types for their gear</p></li><li><p>Rework attack data.
        This may require redoing some items.</p></li><li><p>Move many sheet
        functions to context menus</p></li></ol><h2>Alpha 1
        (0.alpha1)</h2><p>Initial Release</p>
