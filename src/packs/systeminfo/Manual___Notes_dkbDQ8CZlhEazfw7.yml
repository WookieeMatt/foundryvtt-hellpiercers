  - sort: 300000
    name: Quick Start
    type: text
    _id: JpTqVd7ZgoDadZWh
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><strong>Game Master</strong></p><ol><li>Create a world with the HELLPIERCERS system. Enable <strong>Dice So
        Nice</strong>, <strong>Automated Animations</strong> (with Sequencer and socketlib) and a <strong>JB2A</strong>
        library if you want them; none are required.</li><li>Open the Actors tab. The <strong>Faction / Party</strong>
        button in its header creates the squad's Party and the Factions.</li><li>Create one Party for the squad and
        three Factions for the campaign. Factions are built from the book: Crown, Qualities, starting locations and
        upgrades are already filled in.</li><li>Import the units you need from the <strong>Faction Units</strong>
        compendium and place them on a scene.</li><li>Start a combat, add the squad and the enemies, and press
        play.</li></ol><p><strong>Players</strong></p><ol><li>Create a <strong>HELLPIERCER</strong> actor. Drag a class,
        an armor and weapons from the <strong>Player Gear</strong> compendium onto the sheet; their abilities come with
        them.</li><li>Sheets open locked. Flip the switch in the header to edit stats and items, then flip it back to
        play.</li><li>In combat use the <strong>Main / Support / Aux / Move</strong> pips under the name, the bolt on an
        ability to use it, and the dice icon on a weapon to attack.</li></ol>
    video:
      controls: true
      volume: 0.5
    src: null
    ownership:
      default: -1
    flags: {}
