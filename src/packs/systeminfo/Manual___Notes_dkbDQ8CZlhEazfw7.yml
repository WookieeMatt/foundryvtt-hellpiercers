  - sort: 300000
    name: Attacks
    type: text
    _id: woBcekCLT8xp6Cni
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>On the sheets, click on the dice icon near a weapon, attack or strike
        to open the targeting dialog.</p><p>If the attack is an area of effect
        attack, there will be a range button in the dialog. Click the button to
        hide the dialog and put a template down. Generally you'll be clicking
        the space where the attacking unit it for placement. While placing the
        scroll wheel will rotate the template between the 4 cardinal
        directions.</p><p>Once the template is placed, any affected units will
        be targeted. If the attack is not an aoe, or if you want to fine tune
        targets, the normal foundry targeting tools can be used. The T and
        Shift+T hotkeys are easy to use.</p><p>Confirm the dialog and dice will
        be rolled and cards printed for each target. Users that can modify the
        target will be shown an apply damage button to automatically apply the
        damage. When applying, a confirmation will be shown.</p>
