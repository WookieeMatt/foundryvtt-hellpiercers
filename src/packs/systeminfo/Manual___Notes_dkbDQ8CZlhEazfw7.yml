  - sort: 500000
    name: STRATCOM
    type: text
    _id: iHHEtCIFAieEH9al
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><strong>The Party.</strong> The Party sheet holds the division's Hellsteel, Soulfire and Brimstone, its
        buildings, the active mission, the vehicle, Roles, Triumphs, Off-Grid Munitions, Grid Manipulation suites,
        Legendary Arms (and their Aion) and Class Mastery.</p><ul><li><strong>Buildings</strong> follow the drawn tech
        tree. Buildings unlock gear, weapons, armor and classes; items that are still locked cannot be dropped on a
        sheet. Cross Class Development, Limit Breaks, Reversals and weapon slots follow the Party's buildings (setting
        <em>Unlocks From Party Buildings</em>).</li><li><strong>Missions.</strong> Pick the objectives and the target
        faction, then <strong>Leave DIS</strong>. When the squad comes back, <strong>Return to DIS</strong> pays the
        rewards, rearms and heals the squad, advances Class Mastery and gives the GM Ichor (1 per mission, 2 per hero
        defeated).</li><li><strong>Roles and Triumphs</strong> list their STRATCOM and RECON actions; using one pays the
        cost and posts it. Bleeding, Reckless, No Gear and Echo are automatic.</li></ul><p><strong>Factions.</strong> A
        Faction's four Qualities are the sum of its active locations, and its Crown falls by one for every two Quality
        points lost. The dice icon next to a Quality rolls it (1D6 per dot, a 6 is a Success; shift-click rolls
        publicly). Tabs:</p><ul><li><strong>Locations</strong> with build time, status (active, under construction,
        lost) and what players know.</li><li><strong>Convoys</strong> arrive at the start of the second phase after they
        are deployed.</li><li><strong>Research</strong> projects: pay Ichor, fill Research Time boxes, at most two at a
        time.</li><li><strong>Actions</strong> (GM only): the faction's STRATCOM actions, with their Crown gates. Using
        one posts it to the GM. Some create a <strong>map hazard</strong>: Devolve advances a stage every STRATCOM
        phase, Eyerot grows one stage each time the action is used at a location. Create Map Hazard adds a custom
        one.</li><li><strong>Upgrades</strong> unlocked with Ichor, and <strong>Notes</strong> with the War
        Journal.</li></ul><p><strong>Ichor and the phase.</strong> The GM's Ichor and the STRATCOM phase are shown in
        the header of the Party and Faction sheets. <strong>Advance phase</strong> (a button there, or the <em>Advance
        STRATCOM Phase</em> macro) builds locations, moves convoys and grows hazards, and whispers a summary to the GM.
        <em>Gain Ichor</em> and <em>Gain Resources</em> are macros too.</p><p><strong>Campaign map.</strong> The
        <em>Create Campaign Map</em> macro builds a gridless scene from the three faction map segments. Put one 1:1.8
        image per faction at <code>assets/hellpiercers/maps/&lt;faction id&gt;.webp</code>; the book's art is not
        included.</p>
