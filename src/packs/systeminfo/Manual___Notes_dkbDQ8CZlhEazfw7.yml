  - sort: 200000
    name: Building Items
    type: text
    _id: ffis5fdmv3EmuexX
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>In the current version, due to the possibility of underlying data
        changes, I'm not shipping compendiums quite yet.</p><p>For most items,
        it's pretty straightforward. Bosses have a button on their sheets to add
        abilities and minions don't need items.</p><p>For player abilities, it's
        a bit more complicated (but not ridiculously so!). Weapons can be built
        on their own and dropped onto the HELLPIERCER sheet. For classes, you'll
        need to make the ability items separate from the class
        item.</p><ol><li><p>Create an item of type Class and fill in the name,
        description and health value.</p></li><li><p>Create an item of type
        Ability and fill in the name and effect specifying it as an Active. Then
        drag the corresponding class item from the sidebar to the "Enter UUID or
        Drop Document" area at the bottom of the sheet. Then close the sheet and
        drag the Active item to Active section on the
        class.</p></li><li><p>Repeat step 2 except choosing the Passive subtype
        and dragging it to the Passive input.</p></li><li><p>Repeat step 2 this
        time choosing the Limit Break subtype and filling in the break value and
        dragging it to the Limit Break section.</p></li></ol><p>Creating an
        Armor item is similar, except using the Movement, Active and Reversal
        subtypes for each ability.</p><p>When creating a weapon, clicking on the
        cog button for the range will open an editor for the range. You can
        select from the different range types or build a bespoke range pattern.
        Ranges are built and displayed with the origin facing east.  Clicking
        the cog button near the damage will open an advanced editor for the
        damage.</p>
