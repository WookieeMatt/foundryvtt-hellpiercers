  - sort: 1000000
    name: Building Items
    type: text
    _id: P0xuprZA0GWTJkBe
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Most items come from the Player Gear compendium. To build your own:</p><ol><li><strong>Weapons</strong> have
        one or more attack profiles. The cog next to the range opens the range editor (a standard shape or a bespoke
        pattern, drawn facing east); the cog next to the damage opens the damage editor for Effects and
        qualities.</li><li><strong>Classes and armor</strong> list their abilities by link. Create the ability items
        first, then drop the class or armor on each ability's UUID field and drop the abilities back onto the class
        slots (Active, Passive, Limit Break; or Movement, Active, Reversal for armor).</li><li><strong>Bosses</strong>
        have a button on the sheet to add attacks and a special; <strong>minions</strong> carry a strike and a special
        and need no items, and Minibosses add extra attacks as items.</li></ol>
    video:
